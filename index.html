<!DOCTYPE html>

<head>

<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fef2f2; color: #1f2937; -webkit-font-smoothing: antialiased; min-height: 100vh; }
.app-container { max-width: 540px; margin: 0 auto; padding: 0.5rem; }

/* === HEADER === */
.header { background: #dc2626; color: white; border-radius: 0 0 1rem 1rem; padding: 1.25rem 1rem 1rem; position: relative; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }

/* === ONLINE STATUS === */
.online-row { background: white; border-radius: 0.5rem; padding: 0.4rem 0.75rem; margin: 0.5rem 0; font-size: 0.75rem; color: #6b7280; display: flex; align-items: center; gap: 0.4rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }

/* === TABS === */
.tabs { background: white; display: flex; border-bottom: 2px solid #e5e7eb; overflow-x: auto; scrollbar-width: thin; border-radius: 0.5rem 0.5rem 0 0; }
.tabs::-webkit-scrollbar { height: 3px; }
.tab { flex: 1; padding: 0.7rem 0.4rem; text-align: center; font-weight: 600; cursor: pointer; border: none; background: #f9fafb; color: #6b7280; font-size: 0.78rem; white-space: nowrap; transition: 0.15s; min-width: 52px; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
.tab.active { background: #dc2626; color: white; }
.tab:hover:not(.active) { background: #f3f4f6; }

h2 { font-size: 1.25rem; margin-bottom: 0.75rem; }
h3 { font-size: 1rem; margin: 1rem 0 0.5rem; color: #374151; }

.stat-card .label { font-size: 0.75rem; color: #6b7280; margin-bottom: 0.25rem; }

/* === BUTTONS === */
.btn { padding: 0.65rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; text-decoration: none; }

.btn-full { width: 100%; }
.btn-red { background: #dc2626; color: white; }
.btn-green { background: #16a34a; color: white; }
.btn-blue { background: #2563eb; color: white; }
.btn-orange { background: #ea580c; color: white; }

/* === FORMS === */
.form-group { margin-bottom: 0.85rem; }
label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 0.3rem; color: #374151; }
input, select, textarea { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.95rem; font-family: inherit; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* === ALERTS === */
.alert { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 0.75rem; font-size: 0.85rem; border-left: 4px solid; }
.alert-info { background: #dbeafe; color: #1e40af; border-color: #2563eb; }

.bar-card .bc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
.bar-card .bc-title { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
.bar-circle { width: 28px; height: 28px; background: #fef3c7; color: #78350f; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }

/* === MODAL === */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.modal { background: white; border-radius: 1rem; padding: 1.25rem; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #e5e7eb; }

.modal-close { background: #f3f4f6; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }

/* === COLLAPSIBLE === */
.collapsible-section { margin-bottom: 0.75rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; overflow: hidden; }
.collapsible-section > summary { padding: 0.75rem 1rem; background: #f9fafb; cursor: pointer; font-weight: 600; font-size: 0.95rem; user-select: none; list-style: none; display: flex; align-items: center; justify-content: space-between; }
.collapsible-section > summary::-webkit-details-marker { display: none; }
.collapsible-section > summary::after { content: '▼'; font-size: 0.7rem; color: #6b7280; transition: transform 0.2s; }
.collapsible-section[open] > summary::after { transform: rotate(180deg); }
.collapsible-section[open] > summary { background: #fee2e2; color: #991b1b; border-bottom: 1px solid #e5e7eb; }

/* === LOGIN === */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background: linear-gradient(135deg, #dc2626, #991b1b); }
.login-box { background: white; border-radius: 1rem; padding: 2rem 1.5rem; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.login-box .emoji { text-align: center; font-size: 3rem; }
.login-box h1 { text-align: center; color: #dc2626; margin: 0.5rem 0 0.25rem; font-size: 1.5rem; }
.login-box .subtitle { text-align: center; color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
.login-error { background: #fee2e2; color: #991b1b; padding: 0.6rem 0.85rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
.login-success { background: #d1fae5; color: #065f46; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
.login-btn { width: 100%; padding: 0.8rem; border: none; border-radius: 0.5rem; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
.login-btn.primary { background: #dc2626; color: white; }
.login-toggle { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #6b7280; }
.login-toggle a { color: #dc2626; cursor: pointer; font-weight: 600; text-decoration: none; }
.login-toggle a:hover { text-decoration: underline; }
.shift-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
.shift-opt { padding: 0.75rem 0.4rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; text-align: center; font-weight: 700; cursor: pointer; transition: 0.15s; background: white; font-size: 0.95rem; }
.shift-opt:hover { border-color: #fbbf24; }
.shift-opt.selected { background: #fef3c7; border-color: #f59e0b; color: #78350f; }

/* === UTILS === */
.divider { height: 1px; background: #e5e7eb; margin: 1.25rem 0; }
.flex { display: flex; gap: 0.5rem; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.flex-wrap { flex-wrap: wrap; }
.text-center { text-align: center; }
.text-gray { color: #6b7280; }
.text-sm { font-size: 0.8rem; }
.text-xs { font-size: 0.7rem; }
.text-lg { font-size: 1.05rem; }
.font-bold { font-weight: 700; }
.mb-1 { margin-bottom: 0.5rem; }
.mb-2 { margin-bottom: 1rem; }
.mt-1 { margin-top: 0.5rem; }
.mt-2 { margin-top: 1rem; }
.hidden { display: none !important; }
.color-red { color: #dc2626; }
.color-green { color: #16a34a; }
.color-orange { color: #ea580c; }
.color-blue { color: #2563eb; }
.color-gray { color: #6b7280; }

/* === RESPONSIVE MOBILE === */
@media (max-width: 600px) {
    .app-container { padding: 0.4rem; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .product-grid { grid-template-columns: repeat(2, 1fr); }
    .header { padding: 1rem; }
    .header h1 { font-size: 1.15rem; }
    .header-stats { grid-template-columns: repeat(2, 1fr); }
    .content { padding: 0.85rem; }
    h2 { font-size: 1.15rem; }

    .stat-card .value { font-size: 1.3rem; }
    .header-stat .hs-value { font-size: 1rem; }
    .collapsible-section > summary { padding: 0.65rem 0.75rem; font-size: 0.88rem; }
    .collapsible-section .collapsible-body { padding: 0.5rem; max-height: 500px; }
    .item-row { padding: 0.6rem; gap: 0.35rem; font-size: 0.88rem; }
}

/* === TOGGLE SWITCH === */
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-top: 1px solid #e5e7eb; }
.toggle-row:first-child { border-top: none; }
.toggle-label { font-size: 0.9rem; font-weight: 600; }
.toggle-desc { font-size: 0.75rem; color: #6b7280; margin-top: 0.15rem; }
.toggle { width: 42px; height: 24px; background: #d1d5db; border-radius: 9999px; position: relative; cursor: pointer; transition: 0.2s; flex-shrink: 0; border: none; }
.toggle::after { content: ''; width: 18px; height: 18px; background: white; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: 0.2s; }
.toggle.on { background: #16a34a; }
.toggle.on::after { left: 21px; }
</style>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyC_C2ER65Ih1LY-eq_jc42wuFz09Q4Bo9c",
    authDomain: "bar-vvf-lentini.firebaseapp.com",
    databaseURL: "https://bar-vvf-lentini-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "bar-vvf-lentini",
    storageBucket: "bar-vvf-lentini.firebasestorage.app",
    messagingSenderId: "671303628842",
    appId: "1:671303628842:web:5c9abff4aa1ed7f99b6b53"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const fbAuth = firebase.auth();

// =============================================
// UTILITIES
// =============================================
const SHIFTS = ['A','B','C','D'];
const REFERENTE_EMAIL = 'luca.lagana@vigilfuoco.it';
const QUOTA_START = '2026-12'; // primo mese in cui i turni versano la quota al fondo

function isVigileRole(r) { return r === 'vigile' || r === 'user' || !r; }
function r2(n) { return Math.round((n || 0) * 100) / 100; }
// Scala le scorte in modo atomico; ritorna false se non ce ne sono abbastanza (nessun addebito)
async function takeStock(shift, prodId, qty) {
    const res = await db.ref(`bar-data/products/${shift}/${prodId}/stock`).transaction(c => {
        if (c === null) return null;      // valore non ancora in cache: Firebase riprova col valore reale
        if (c < qty) return;              // abort: scorte insufficienti
        return c - qty;
    });
    return !!(res && res.committed && res.snapshot && res.snapshot.val() !== null);
}
function uid() { return Math.random().toString(36).substr(2, 9); }
function toMap(arr, key='id') { const m = {}; arr.forEach(x => m[x[key]] = x); return m; }
function toArr(obj) { return obj ? Object.values(obj).filter(Boolean) : []; }
function escapeHtml(s) { if(s==null)return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { if(s==null)return ''; return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function fmt(iso) { if(!iso) return ''; const d=new Date(iso); if(isNaN(d))return ''; return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+', '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
function currentMonth() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function formatMonth(ym) {
    if (!ym) return '—';
    const [y, m] = ym.split('-');
    const months = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
    return (months[parseInt(m)-1] || m) + ' ' + y;
}
function monthsSince(ym) {
    if (!ym) return 0;
    const [y, m] = ym.split('-').map(Number);
    const now = new Date();
    return (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
}

// =============================================
// MODAL HELPERS
// =============================================
function modal(title, body) {
    document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)modalClose()">
            <div class="modal">
                <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="modalClose()">✕</button></div>
                ${body}
            </div>
        </div>`;
}
function modalClose() { document.getElementById('modal-root').innerHTML = ''; }

// Equal split
function splitQty(qty, shifts) {
    const out = {}; shifts.forEach(s => out[s] = 0);
    if (!shifts.length || qty <= 0) return out;
    const base = Math.floor(qty / shifts.length);
    const remainder = qty - base * shifts.length;
    shifts.forEach((s, i) => { out[s] = base + (i < remainder ? 1 : 0); });
    return out;
}

<script>
// =============================================
// AUTH MODULE
// =============================================
const Auth = {
    user: null,
    _pickedShift: null,

    init() {
        fbAuth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    // Subito dopo la registrazione il profilo può non essere ancora scritto: riprovo per qualche secondo
                    let userData = null;
                    for (let i = 0; i < 8 && !userData; i++) {
                        const snap = await db.ref('users/' + user.uid).once('value');
                        userData = snap.val();
                        if (!userData) await new Promise(r => setTimeout(r, 500));
                    }
                    if (!userData) { await fbAuth.signOut(); return; }
                    this.user = { uid: user.uid, email: user.email, ...userData };
                    this.showApp();
                } catch(e) {
                    console.error('Auth error:', e);
                    this.showError('login-error', 'Errore caricamento profilo: ' + e.message);
                }
            } else {
                this.user = null;
                this.showLogin();
            }
        });
    },

    showError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.classList.remove('hidden');
    },

    showLogin() {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
    },

    showApp() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        App.init();
    },

    toggleView(view) {
        ['login','register','forgot'].forEach(v => {
            const el = document.getElementById(v + '-view');
            if (el) el.classList.toggle('hidden', view !== v);
        });
        ['login-error','reg-error','forgot-error','forgot-success'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        });
        if (view === 'forgot') {
            const loginEmail = document.getElementById('login-email')?.value.trim();
            if (loginEmail) document.getElementById('forgot-email').value = loginEmail;
        }
    },

    pickShift(s) {
        this._pickedShift = s;
        document.querySelectorAll('#reg-shift .shift-opt').forEach(el => {
            el.classList.toggle('selected', el.dataset.shift === s);
        });
    },

    async login() {
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-pass').value;
        const err = document.getElementById('login-error');
        err.classList.add('hidden');
        if (!email || !pass) { this.showError('login-error', 'Inserisci email e password'); return; }
        try {
            await fbAuth.signInWithEmailAndPassword(email, pass);
        } catch(e) {
            let msg = 'Errore di accesso';
            if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'Email o password errati';
            else if (e.code === 'auth/invalid-email') msg = 'Email non valida';
            else if (e.code === 'auth/too-many-requests') msg = 'Troppi tentativi, riprova più tardi';
            else msg = 'Errore: ' + e.message;
            this.showError('login-error', msg);
        }
    },

    async register() {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const pass = document.getElementById('reg-pass').value;
        const shift = this._pickedShift;
        const err = document.getElementById('reg-error');
        err.classList.add('hidden');

        if (!name || name.length < 3) { this.showError('reg-error', 'Inserisci nome e cognome'); return; }
        if (!email || !email.match(/^[^@]+@[^@]+\.[^@]+$/)) { this.showError('reg-error', 'Email non valida'); return; }
        if (!pass || pass.length < 6) { this.showError('reg-error', 'Password: almeno 6 caratteri'); return; }

        // Referente non deve scegliere turno
        const isReferente = email === REFERENTE_EMAIL;
        if (!isReferente && !shift) { this.showError('reg-error', 'Seleziona il tuo turno'); return; }

        try {
            const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
            const userData = {
                name,
                email,
                role: isReferente ? 'referente' : 'vigile',
                shift: isReferente ? null : shift,
                createdAt: new Date().toISOString()
            };
            await db.ref('users/' + cred.user.uid).set(userData);
        } catch(e) {
            let msg = 'Errore registrazione';
            if (e.code === 'auth/email-already-in-use') msg = 'Email già registrata';
            else if (e.code === 'auth/weak-password') msg = 'Password troppo debole (min 6 caratteri)';
            else if (e.code === 'auth/invalid-email') msg = 'Email non valida';
            else msg = 'Errore: ' + e.message;
            this.showError('reg-error', msg);
        }
    },

    async sendReset() {
        const email = document.getElementById('forgot-email').value.trim();
        const err = document.getElementById('forgot-error');
        const ok = document.getElementById('forgot-success');
        err.classList.add('hidden');
        ok.classList.add('hidden');
        if (!email) { this.showError('forgot-error', 'Inserisci la tua email'); return; }
        if (!email.match(/^[^@]+@[^@]+\.[^@]+$/)) { this.showError('forgot-error', 'Email non valida'); return; }
        try {
            await fbAuth.sendPasswordResetEmail(email);
            ok.innerHTML = `✅ Email inviata a <strong>${escapeHtml(email)}</strong>!<br><br>Controlla la posta (e la cartella <strong>Spam</strong>).`;
            ok.classList.remove('hidden');
            document.getElementById('forgot-email').value = '';
        } catch(e) {
            let msg = 'Errore invio email';
            if (e.code === 'auth/user-not-found') msg = 'Nessun account con questa email';
            else if (e.code === 'auth/invalid-email') msg = 'Email non valida';
            else if (e.code === 'auth/too-many-requests') msg = 'Troppi tentativi, riprova più tardi';
            else msg = 'Errore: ' + e.message;
            this.showError('forgot-error', msg);
        }
    },

    logout() {
        if (confirm('Vuoi uscire?')) fbAuth.signOut();
    },

    // Role checks
    // 'super_admin' è il vecchio nome del Referente (prima della migrazione)
    isReferente() { return !!this.user && (this.user.role === 'referente' || this.user.role === 'super_admin'); },
    isAdmin() { return !!this.user && (this.user.role === 'admin' || this.isReferente()); },
    isAdminOf(shift) {
        if (!this.user) return false;
        if (this.isReferente()) return true;
        return this.user.role === 'admin' && this.user.shift === shift;
    },
    myShift() { return this.user ? this.user.shift : null; },
    myUid() { return this.user ? this.user.uid : null; }
};
</script>
<script>
// =============================================
// APP MODULE — v3 Bar separati per turno
// =============================================
const App = {
    // State
    fondo: { saldo: 0, quotaMensile: 25, movimenti: {} },
    bars: { A: null, B: null, C: null, D: null },
    products: { A: [], B: [], C: [], D: [] }, // array per turno
    members: [],
    transactions: [],
    purchases: [],
    users: [],
    schemaVersion: null,

    tab: 'home',
    listeners: [],
    _migrationChecked: false,

    async init() {
        await this._migrateIfNeeded();
        this.setupListeners();
        this.render();
    },

    // =============================================
    // MIGRAZIONE v2 → v3 (una tantum, solo Referente)
    // =============================================
    async _migrateIfNeeded() {
        if (this._migrationChecked) return;
        this._migrationChecked = true;
        try {
            const snap = await db.ref('bar-data/schemaVersion').once('value');
            const version = snap.val();
            if (version === 3) return; // già migrato
            if (version !== 2) return; // schema inatteso, non tocco
            // Solo il Referente può lanciare la migrazione
            if (!Auth.isReferente() && (Auth.user.email || '').toLowerCase() !== REFERENTE_EMAIL) return;
            console.log('[Migration v2→v3] Inizio');
            await Migration.run();
        } catch(e) {
            console.error('[Migration] errore check:', e);
        }
    },

    setupListeners() {
        this.listeners.forEach(l => l()); this.listeners = [];

        const barRef = db.ref('bar-data');
        barRef.on('value', snap => {
            const d = snap.val() || {};
            this.schemaVersion = d.schemaVersion;
            this.fondo = d.fondoDistaccamento || { saldo: 0, quotaMensile: 25, movimenti: {} };
            SHIFTS.forEach(s => {
                this.bars[s] = (d.bars && d.bars[s]) || this._defaultBar(s);
                this.products[s] = toArr((d.products && d.products[s]) || {});
            });
            this.members = toArr(d.members);
            this.transactions = toArr(d.transactions);
            this.purchases = toArr(d.purchases);
            this._updateOnline(true);
            this.render();
        }, err => {
            console.error('DB error:', err);
            this._updateOnline(false);
        });
        this.listeners.push(() => barRef.off());

        const usersRef = db.ref('users');
        usersRef.on('value', snap => {
            const val = snap.val() || {};
            this.users = Object.entries(val).map(([uid, data]) => ({ uid, ...data }));
            // Se il mio ruolo/turno cambia (nomina admin, cambio turno, migrazione) aggiorno subito l'interfaccia
            if (Auth.user && val[Auth.user.uid]) {
                const fresh = val[Auth.user.uid];
                Auth.user = { ...Auth.user, role: fresh.role, shift: fresh.shift || null, name: fresh.name };
            }
            this.render();
        });
        this.listeners.push(() => usersRef.off());
    },

    _defaultBar(shift) {
        return {
            name: 'Bar Turno ' + shift,
            subtitle: '',
            cassa: 0,
            allowGuests: true,
            allowCredit: true,
            quotaMese: {},
            firstAdminUid: null
        };
    },

    _updateOnline(ok) {
        const dot = document.getElementById('online-dot');
        const txt = document.getElementById('online-text');
        if (!dot) return;
        if (ok) { dot.className = 'dot'; txt.textContent = 'Online · ' + new Date().toLocaleTimeString('it-IT'); }
        else { dot.className = 'dot offline'; txt.textContent = 'Offline'; }
    },

    // =============================================
    // HELPERS state
    // =============================================
    // Vigili attivi (esclusi i trasferiti/rimossi, che restano nel database con il loro storico)
    active() { return this.members.filter(m => !m.removed); },

    myMember() {
        if (!Auth.user) return null;
        return this.members.find(m => m.userId === Auth.user.uid);
    },

    // Debito totale di un utente/member distribuito nei bar
    totalDebtOfMember(memberId) {
        const bpb = (this.members.find(m => m.id === memberId) || {}).balancePerBar || {};
        let total = 0; SHIFTS.forEach(s => total += (bpb[s] || 0));
        return total;
    },

    // Debito del Referente, distribuito
    referenteDebts() {
        if (!Auth.isReferente()) return { total: 0, byBar: {A:0,B:0,C:0,D:0} };
        const me = this.myMember();
        if (!me) return { total: 0, byBar: {A:0,B:0,C:0,D:0} };
        const byBar = me.balancePerBar || {A:0,B:0,C:0,D:0};
        let total = 0; SHIFTS.forEach(s => total += (byBar[s] || 0));
        return { total, byBar };
    },

    // Crediti totali del bar (somma debiti dei vigili in quel bar)
    crediti(shift) {
        let total = 0;
        this.members.forEach(m => {
            const bpb = m.balancePerBar || {};
            total += (bpb[shift] || 0);
        });
        return total;
    },

    // Mesi dovuti dal mese di avvio della riforma fino al mese corrente compreso
    _dueMonths() {
        let start = this.fondo.startMonth || currentMonth();
        if (start < QUOTA_START) start = QUOTA_START; // le quote partono da dicembre 2026
        const out = [];
        const cur = currentMonth();
        if (start > cur) return []; // nessuna quota ancora dovuta
        let [y, m] = start.split('-').map(Number);
        for (let i = 0; i < 120; i++) {
            const ym = y + '-' + String(m).padStart(2, '0');
            out.push(ym);
            if (ym >= cur) break;
            m++; if (m > 12) { m = 1; y++; }
        }
        return out;
    },

    // Mesi non ancora versati (dal più vecchio)
    unpaidMonths(shift) {
        const paid = ((this.bars[shift] || {}).quotaMese) || {};
        return this._dueMonths().filter(ym => paid[ym] !== 'pagata');
    },

    // pagata = tutto in regola · pendente = manca solo il mese in corso · ritardo = manca almeno un mese passato
    quotaStatus(shift) {
        const unpaid = this.unpaidMonths(shift);
        if (unpaid.length === 0) return 'pagata';
        const cur = currentMonth();
        if (unpaid.some(ym => ym < cur)) return 'ritardo';
        return 'pendente';
    },

    // =============================================
    // RENDER MAIN
    // =============================================
    render() {
        if (!Auth.user) return;
        this._renderHeader();
        this._renderTabs();
        this._renderContent();
    },

    _renderHeader() {
        const u = Auth.user;
        const sh = Auth.myShift();
        const titleEl = document.getElementById('app-title');
        const userEl = document.getElementById('user-line');

        let title = '🚒 Bar VVF Lentini';
        let roleBadge = '';
        if (Auth.isReferente()) roleBadge = '<span class="badge badge-ref">👑 Referente</span>';
        else if (u.role === 'admin') roleBadge = '<span class="badge badge-admin">🔧 Admin T' + (sh || '-') + '</span>';
        else roleBadge = '<span class="badge badge-user">T' + (sh || '-') + '</span>';

        titleEl.textContent = title;
        userEl.innerHTML = escapeHtml(u.name) + ' · ' + roleBadge;

        // Header stats differenti per ruolo
        const statsEl = document.getElementById('header-stats');
        if (Auth.isReferente()) {
            statsEl.innerHTML = `
                <div class="header-stat"><div class="hs-label">💰 Fondo</div><div class="hs-value">€${this.fondo.saldo.toFixed(2)}</div></div>
                <div class="header-stat"><div class="hs-label">🏦 Casse tot</div><div class="hs-value">€${this._sumCasse().toFixed(2)}</div></div>
                <div class="header-stat"><div class="hs-label">📊 Crediti</div><div class="hs-value">€${this._sumCrediti().toFixed(2)}</div></div>
                <div class="header-stat"><div class="hs-label">👥 Vigili</div><div class="hs-value">${this.active().length}</div></div>
            `;
        } else {
            // vigile/admin — vede il suo bar
            const bar = sh ? this.bars[sh] : null;
            const myDebt = (this.myMember() || {}).balancePerBar || {};
            const debtInMyBar = sh ? (myDebt[sh] || 0) : 0;
            statsEl.innerHTML = `
                <div class="header-stat"><div class="hs-label">💰 Cassa T${sh||'-'}</div><div class="hs-value">€${bar ? bar.cassa.toFixed(2) : '0.00'}</div></div>
                <div class="header-stat"><div class="hs-label">📊 Mio debito</div><div class="hs-value">€${debtInMyBar.toFixed(2)}</div></div>
                <div class="header-stat"><div class="hs-label">☕ Caffè</div><div class="hs-value">${this._countCoffee(sh)}</div></div>
                <div class="header-stat"><div class="hs-label">👥 T${sh||'-'}</div><div class="hs-value">${this.active().filter(m=>m.shift===sh).length}</div></div>
            `;
        }
    },

    _sumCasse() { let s = 0; SHIFTS.forEach(sh => { if (this.bars[sh]) s += this.bars[sh].cassa; }); return s; },
    _sumCrediti() { let s = 0; SHIFTS.forEach(sh => s += this.crediti(sh)); return s; },
    _countCoffee(shift) {
        if (!shift) return 0;
        let c = 0;
        (this.products[shift] || []).forEach(p => { if (p.isCoffee) c += (p.stock || 0); });
        return c;
    },

    _renderTabs() {
        let tabs;
        if (Auth.isReferente()) {
            tabs = [
                ['home','📊','Panoramica'],
                ['bar','🏪','Bar turni'],
                ['fondo','💰','Fondo'],
                ['vigili','👥','Vigili'],
                ['admin','👑','Admin']
            ];
        } else if (Auth.user.role === 'admin') {
            tabs = [
                ['home','🏠','Home'],
                ['acquista','🛒','Acquista'],
                ['vendita','💵','Vendita'],
                ['magazzino','📦','Magazzino'],
                ['conti','📋','Conti'],
                ['cassa','💶','Cassa'],
                ['settings','⚙️','Bar']
            ];
        } else {
            tabs = [
                ['home','🏠','Home'],
                ['acquista','🛒','Acquista'],
                ['storico','📋','Storico']
            ];
        }
        document.getElementById('tabs').innerHTML = tabs.map(([id, emoji, label]) =>
            `<button class="tab ${this.tab===id?'active':''}" onclick="App.switchTab('${id}')" title="${label}"><span class="tab-emoji">${emoji}</span><span class="tab-label">${label}</span></button>`
        ).join('');
    },

    switchTab(t) { this.tab = t; this.render(); },

    _renderContent() {
        const u = Auth.user;
        let html = '';
        // Account disattivato (trasferito): nessun accesso al bar
        if (u.role === 'disattivato') {
            document.getElementById('tabs').innerHTML = '';
            document.getElementById('header-stats').innerHTML = '';
            document.getElementById('content').innerHTML = `
                <h2>🚪 Account disattivato</h2>
                <div class="alert alert-info">Il tuo account non è più attivo in questo distaccamento (trasferimento o uscita). Se rientri, chiedi al Referente di riattivarlo.</div>`;
            return;
        }
        // Database non ancora migrato: l'app nuova non deve essere usata
        if (this.schemaVersion !== undefined && this.schemaVersion !== 3) {
            const isRef = Auth.isReferente() || (u.email || '').toLowerCase() === REFERENTE_EMAIL;
            document.getElementById('tabs').innerHTML = '';
            document.getElementById('content').innerHTML = isRef ? `
                <h2>🔄 Migrazione da eseguire</h2>
                <div class="alert alert-warn">Il database è ancora nel formato vecchio. Finché non esegui la migrazione l'app nuova non è utilizzabile.</div>
                <button class="btn btn-red btn-full" onclick="App._migrationChecked=false;Migration.run()">Mostra anteprima e migra</button>
            ` : `
                <h2>🔧 App in aggiornamento</h2>
                <div class="alert alert-info">Il bar sta passando alla gestione per turni. Riprova tra qualche minuto.</div>
            `;
            return;
        }
        try {
            if (Auth.isReferente()) {
                if (this.tab === 'home') html = this.page_ref_home();
                else if (this.tab === 'bar') html = this.page_ref_bar();
                else if (this.tab === 'fondo') html = this.page_ref_fondo();
                else if (this.tab === 'vigili') html = this.page_ref_vigili();
                else if (this.tab === 'admin') html = this.page_ref_admin();
                else { this.tab='home'; html = this.page_ref_home(); }
            } else if (u.role === 'admin') {
                if (this.tab === 'home') html = this.page_user_home();
                else if (this.tab === 'acquista') html = this.page_acquista();
                else if (this.tab === 'vendita') html = this.page_admin_vendita();
                else if (this.tab === 'magazzino') html = this.page_admin_magazzino();
                else if (this.tab === 'conti') html = this.page_admin_conti();
                else if (this.tab === 'settings') html = this.page_admin_settings();
                else if (this.tab === 'cassa') html = this.page_admin_cassa();
                else { this.tab='home'; html = this.page_user_home(); }
            } else {
                if (this.tab === 'home') html = this.page_user_home();
                else if (this.tab === 'acquista') html = this.page_acquista();
                else if (this.tab === 'storico') html = this.page_user_storico();
                else { this.tab='home'; html = this.page_user_home(); }
            }
        } catch(e) {
            console.error('Render error:', e);
            html = '<div class="alert alert-danger">Errore: ' + escapeHtml(e.message) + '</div>';
        }
        document.getElementById('content').innerHTML = html;
    }
};
</script>
<script>

// ---- Home Referente: panoramica fondo + 4 turni ----
App.page_ref_home = function() {
    const mese = formatMonth(currentMonth());

    const spese = this._speseMese();
    const refDebts = this.referenteDebts();
    const preRiformaResiduo = this.members.reduce((s,m) => s + (m.debitoFondo || 0), 0);
    const preRiformaConDebito = this.members.filter(m => (m.debitoFondo||0) > 0).length;

    return `
        <h2>📊 Panoramica distaccamento</h2>

        <div class="alert alert-info">
            <div class="flex-between">
                <div><strong>Fondo distaccamento</strong><br><span class="text-sm">${mese}</span></div>
                <div class="text-lg font-bold color-green">€${this.fondo.saldo.toFixed(2)}</div>
            </div>
            <div class="flex mt-1 text-sm">
                <div style="flex:1"><strong class="color-green">+€${quote.toFixed(2)}</strong><br>Quote mese</div>

        </div>

        ${preRiformaResiduo > 0 ? `
            <div class="alert alert-warn">
                <div class="flex-between">
                    <div>
                        <strong>💰 Crediti pre-riforma da riscuotere</strong><br>
                        <span class="text-sm">${preRiformaConDebito} vigili devono ancora saldare. Quando lo faranno i soldi entreranno nel fondo.</span>
                    </div>
                    <strong class="color-orange text-lg">€${preRiformaResiduo.toFixed(2)}</strong>
                </div>
            </div>
        ` : ''}

        <h3>🏪 Stato bar per turno</h3>
        <div class="text-sm text-gray mb-1">Quota mensile standard: <strong>€${this.fondo.quotaMensile.toFixed(2)}</strong></div>
        ${SHIFTS.map(s => this._renderBarCard(s)).join('')}

        ${refDebts.total > 0 ? `
            <div class="divider"></div>
            <h3>💵 I miei debiti personali</h3>
            <div class="alert alert-warn">
                <div class="flex-between mb-1">
                    <strong>Totale: €${refDebts.total.toFixed(2)}</strong>
                    <button class="btn btn-red btn-sm" onclick="App.modalRefSaldaAll()">Salda tutto</button>
                </div>
                ${SHIFTS.filter(s => refDebts.byBar[s] > 0).map(s => `
                    <div class="item-row">
                        <div class="item-main"><strong>Bar Turno ${s}</strong></div>
                        <div><strong>€${refDebts.byBar[s].toFixed(2)}</strong> <button class="btn btn-light btn-sm" onclick="App.modalRefSalda('${s}')">Salda</button></div>
                    </div>
                `).join('')}
            </div>
        ` : ''}

        <div class="divider"></div>
        <div class="flex">
            <button class="btn btn-red" style="flex:1" onclick="App.modalRefSpesaFondo()">📝 Spesa dal fondo</button>
            <button class="btn btn-light" style="flex:1" onclick="App.modalRefSetQuota()">⚙️ Quota mensile</button>
        </div>
        ${Auth.isReferente() ? `
            <div class="mt-2">
                <button class="btn btn-light btn-full" onclick="App.modalRefBuyGuest()">🛒 Compra come ospite in un bar</button>
            </div>
        ` : ''}
    `;
};

App._renderBarCard = function(shift) {
    const bar = this.bars[shift];
    if (!bar) return '';
    const stato = this.quotaStatus(shift);
    const notYet = this._dueMonths().length === 0;
    const statoLabel = notYet ? 'Quota da ' + formatMonth(QUOTA_START) : { pagata:'Versata', pendente:'Pendente', ritardo:'In ritardo' }[stato];
    const statoChip = notYet ? 'chip-gray' : { pagata:'chip-green', pendente:'chip-yellow', ritardo:'chip-red' }[stato];
    const barClass = stato === 'ritardo' ? 'bar-card late' : 'bar-card';

    return `
        <div class="${barClass}" onclick="App.switchToBar('${shift}')">
            <div class="bc-head">
                <div class="bc-title"><span class="bar-circle">${shift}</span>${escapeHtml(bar.name)}</div>
                <span class="chip ${statoChip}">${statoLabel}</span>
            </div>
            <div class="bc-meta">
                <span>Cassa <strong>€${bar.cassa.toFixed(2)}</strong></span>
                <span>Crediti <strong>€${this.crediti(shift).toFixed(2)}</strong></span>
                <span>Vigili <strong>${this.active().filter(m=>m.shift===shift).length}</strong></span>
            </div>
        </div>
    `;
};

App.switchToBar = function(shift) { this._viewingBar = shift; this.tab = 'bar'; this.render(); };

// ---- Ispezione di un bar singolo (Referente) ----
App.page_ref_bar = function() {
    const sh = this._viewingBar;
    if (!sh) {
        return `
            <h2>🏪 Bar dei turni</h2>
            <div class="text-sm text-gray mb-1">Seleziona un turno per vedere il dettaglio del bar.</div>
            ${SHIFTS.map(s => this._renderBarCard(s)).join('')}
        `;
    }
    const bar = this.bars[sh];
    const prodotti = this.products[sh] || [];
    const vigiliTurno = this.members.filter(m => m.shift === sh);
    const totCrediti = this.crediti(sh);
    const stato = this.quotaStatus(sh);
    const adminTurno = this.users.filter(u => u.role === 'admin' && u.shift === sh);

    return `
        <div class="flex-between mb-2">
            <h2 style="margin:0">🏪 ${escapeHtml(bar.name)}</h2>
            <button class="btn btn-light btn-sm" onclick="App._viewingBar=null;App.render()">← Indietro</button>
        </div>
        <div class="alert alert-info">🔍 Modalità ispezione · Non modificare dati di altri turni</div>

        ${stato !== 'pagata' ? `<div class="alert ${stato==='ritardo'?'alert-danger':'alert-warn'}">⚠️ Quote non versate: <strong>${this.unpaidMonths(sh).map(formatMonth).join(', ')}</strong></div>` : ''}
        ${stato !== 'pagata' ? `<button class="btn btn-warn btn-full mb-2" onclick="App.sollecita('${sh}')">🔔 Sollecita admin del turno</button>` : ''}

        <div class="stats-row">
            <div class="stat-card"><div class="label">💰 Cassa</div><div class="value color-green">€${bar.cassa.toFixed(2)}</div></div>
            <div class="stat-card"><div class="label">📊 Crediti</div><div class="value color-orange">€${totCrediti.toFixed(2)}</div></div>
        </div>

        <h3>👑 Admin del turno (${adminTurno.length})</h3>
        ${adminTurno.length === 0 ? '<div class="alert alert-warn">Nessun admin assegnato! Nominane uno dal pannello Admin.</div>' :
            adminTurno.map(a => `
                <div class="item-row">
                    <div class="item-main">
                        <div class="item-title">${escapeHtml(a.name)}</div>
                        <div class="item-sub">${escapeHtml(a.email)}</div>
                    </div>
                </div>
            `).join('')}

        <h3>📦 Prodotti (${prodotti.length})</h3>
        ${prodotti.length === 0 ? '<div class="alert alert-info">Il turno non ha ancora configurato prodotti</div>' :
            prodotti.map(p => `
                <div class="item-row ${p.isCoffee?'highlight':''}">
                    <div class="item-main">
                        <div class="item-title">${escapeHtml(p.name)} ${p.isCoffee?'<span class="coffee-tag">CAFFÈ</span>':''}</div>
                        <div class="item-sub">€${p.price.toFixed(2)} · stock: ${p.stock || 0}</div>
                    </div>
                </div>
            `).join('')}

        <h3>💳 Vigili con debito (${vigiliTurno.filter(m => (m.balancePerBar||{})[sh] > 0).length})</h3>
        ${vigiliTurno.filter(m => (m.balancePerBar||{})[sh] > 0).map(m => `
            <div class="item-row">
                <div class="item-main"><strong>${escapeHtml(m.name)}</strong></div>
                <div><strong class="color-orange">€${((m.balancePerBar||{})[sh]||0).toFixed(2)}</strong></div>
            </div>
        `).join('') || '<p class="text-sm text-gray">Nessun debito aperto in questo bar</p>'}

        <h3>🧾 Storico del bar</h3>
        ${this._renderBarHistory(sh)}
    `;
};

// ---- Fondo distaccamento: libro contabile ----
App.page_ref_fondo = function() {
    const movimenti = Object.values(this.fondo.movimenti || {})
        .sort((a,b) => new Date(b.date) - new Date(a.date));
    const mese = currentMonth();
    const movimentiMese = movimenti.filter(m => (m.date || '').startsWith(mese.replace('-','-')));

    let entrate = 0, uscite = 0;
    movimenti.forEach(m => {
        if ((m.importo || 0) >= 0) entrate += m.importo;
        else uscite += Math.abs(m.importo);
    });

    return `
        <h2>💰 Libro contabile fondo</h2>

        <div class="stats-row">
            <div class="stat-card" style="background:#d1fae5">
                <div class="label">💰 Saldo</div>
                <div class="value color-green">€${this.fondo.saldo.toFixed(2)}</div>
            </div>
            <div class="stat-card">
                <div class="label">Quota</div>
                <div class="value">€${this.fondo.quotaMensile.toFixed(2)}</div>
            </div>
        </div>

        <div class="text-sm text-gray mb-2">
            Entrate totali: <strong class="color-green">+€${entrate.toFixed(2)}</strong> ·
            Uscite totali: <strong class="color-red">-€${uscite.toFixed(2)}</strong>
        </div>

        <div class="flex mb-2">
            <button class="btn btn-red" style="flex:1" onclick="App.modalRefSpesaFondo()">📝 Nuova spesa</button>
            <button class="btn btn-light" style="flex:1" onclick="App.modalRefSetQuota()">⚙️ Quota mensile</button>
        </div>

        <details class="collapsible-section" open>
            <summary>Movimenti del mese (${movimentiMese.length})</summary>
            <div class="collapsible-body">
                ${movimentiMese.length === 0 ? '<p class="text-center text-sm text-gray">Nessun movimento questo mese</p>' :
                    movimentiMese.map(m => this._renderMovimentoFondo(m)).join('')}
            </div>
        </details>

        <details class="collapsible-section">
            <summary>Tutti i movimenti (${movimenti.length})</summary>
            <div class="collapsible-body">
                ${movimenti.slice(0,50).map(m => this._renderMovimentoFondo(m)).join('')}
                ${movimenti.length > 50 ? '<p class="text-sm text-gray text-center">Mostrati i 50 più recenti</p>' : ''}
            </div>
        </details>
    `;
};

App._renderMovimentoFondo = function(m) {
    const importo = m.importo || 0;
    const isEntrata = importo >= 0;
    return `
        <div class="item-row ${isEntrata?'ok':'warn'}">
            <div class="item-main">
                <div class="item-title">${escapeHtml(m.descrizione)}</div>
                <div class="item-sub">${fmt(m.date)}${m.registeredBy?' · '+escapeHtml(m.registeredBy):''}${m.categoria?' · '+escapeHtml(m.categoria):''}</div>
            </div>
            <strong class="${isEntrata?'color-green':'color-red'}">${isEntrata?'+':'-'}€${Math.abs(importo).toFixed(2)}</strong>
        </div>
    `;
};

App._quoteMese = function() {
    const mese = currentMonth();
    return Object.values(this.fondo.movimenti || {})
        .filter(m => m.tipo === 'quota' && (m.date || '').startsWith(mese))
        .reduce((s,m) => s + (m.importo || 0), 0);
};
App._speseMese = function() {
    const mese = currentMonth();
    return Object.values(this.fondo.movimenti || {})
        .filter(m => m.tipo === 'spesa' && (m.date || '').startsWith(mese))
        .reduce((s,m) => s + Math.abs(m.importo || 0), 0);
};

// ---- Vigili (Referente): elenco totale ----
App.page_ref_vigili = function() {
    const byShift = (a,b) => (a.shift||'Z').localeCompare(b.shift||'Z') || a.name.localeCompare(b.name);
    const attivi = this.active().sort(byShift);
    const rimossi = this.members.filter(m => m.removed).sort((a,b) => a.name.localeCompare(b.name));
    const row = (m, removed) => {
        const totDebt = this.totalDebtOfMember(m.id);
        const dbtFondo = m.debitoFondo || 0;
        const hasAnyDebt = totDebt > 0 || dbtFondo > 0;
        return `
            <div class="item-row ${hasAnyDebt?'warn':'ok'}">
                <div class="item-main">
                    <div class="item-title">${escapeHtml(m.name)} ${removed ? '<span class="chip chip-gray">trasferito</span>' : `<span class="chip chip-shift">T${m.shift || '?'}</span>`}</div>
                    <div class="item-sub">
                        ${removed ? 'Uscito il ' + fmt(m.removedAt).split(',')[0] + ' · ' : (m.userId ? 'Collegato · ' : 'Non collegato · ')}
                        ${totDebt > 0 ? `Bar: <strong class="color-red">€${totDebt.toFixed(2)}</strong>` : 'Bar: €0'}
                        ${dbtFondo > 0 ? ` · Pre-riforma: <strong class="color-orange">€${dbtFondo.toFixed(2)}</strong>` : ''}
                    </div>
                </div>
                <div class="item-actions">
                    ${dbtFondo > 0 ? `<button class="btn btn-warn btn-sm" onclick="App.modalPayFondo('${m.id}')" title="Registra saldo al fondo">💰 Salda</button>` : ''}
                    ${removed
                        ? `<button class="btn btn-green btn-sm" onclick="App.modalReactivate('${m.id}')">↩️ Riattiva</button>`
                        : `<button class="btn btn-light btn-sm" onclick="App.modalChangeShift('${m.id}')" title="Cambia turno">🔄</button>
                           <button class="btn btn-sm" style="background:#fee2e2;color:#991b1b" onclick="App.modalRemoveMember('${m.id}')" title="Trasferito / rimuovi">🚪</button>`}
                </div>
            </div>`;
    };
    return `
        <h2>👥 Vigili del distaccamento (${attivi.length})</h2>
        <div class="text-sm text-gray mb-1">🔄 cambia turno · 🚪 trasferito/rimuovi. Chi arriva si registra nell'app e lo aggiungi da 👑 Admin con "Nuovo".</div>
        ${attivi.map(m => row(m, false)).join('')}
        ${rimossi.length ? `
            <details class="collapsible-section mt-2">
                <summary>🚪 Trasferiti / rimossi (${rimossi.length})</summary>
                <div class="collapsible-body">${rimossi.map(m => row(m, true)).join('')}</div>
            </details>` : ''}
    `;
};

// Trasferimento in uscita: niente viene cancellato, la scheda va tra i "trasferiti" e l'account viene disattivato
App.modalRemoveMember = function(memberId) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    const bar = this.totalDebtOfMember(m.id), fondo = m.debitoFondo || 0;
    modal(`🚪 Rimuovi ${escapeHtml(m.name)}`, `
        <div class="alert alert-info text-sm">
            Per trasferimento o uscita dal distaccamento. <strong>Non si cancella nulla</strong>: lo storico resta, il suo account viene disattivato e non compare più nelle liste. Se rientra lo riattivi.
        </div>
        ${(bar > 0 || fondo > 0) ? `<div class="alert alert-warn">⚠️ Ha ancora debiti: ${bar > 0 ? 'bar €' + bar.toFixed(2) : ''}${bar > 0 && fondo > 0 ? ' · ' : ''}${fondo > 0 ? 'pre-riforma €' + fondo.toFixed(2) : ''}.<br>Conviene farglieli saldare prima. Se procedi restano registrati e si possono saldare anche dopo.</div>` : '<div class="alert alert-ok">✅ Nessun debito</div>'}
        <div class="form-group"><label>Motivo</label>
            <select id="rm-reason"><option>Trasferito</option><option>Pensione</option><option>Altro</option></select>
        </div>
        <button class="btn btn-red btn-full" onclick="App.doRemoveMember('${memberId}')">Conferma rimozione</button>
    `);
};
App.doRemoveMember = async function(memberId) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    const reason = document.getElementById('rm-reason').value;
    if (m.userId && m.userId === Auth.myUid()) { alert('Non puoi rimuovere te stesso.'); return; }
    try {
        const updates = {};
        updates[`bar-data/members/${memberId}/removed`] = true;
        updates[`bar-data/members/${memberId}/removedAt`] = new Date().toISOString();
        updates[`bar-data/members/${memberId}/removedReason`] = reason;
        if (m.userId && this.users.some(u => u.uid === m.userId)) updates[`users/${m.userId}/role`] = 'disattivato';
        await db.ref().update(updates);
        modalClose();
        alert(`✅ ${m.name} rimosso (${reason}). Lo trovi in fondo alla lista, tra i trasferiti.`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// Rientro: riattiva la scheda e l'account, anche in un turno diverso
App.modalReactivate = function(memberId) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    modal(`↩️ Riattiva ${escapeHtml(m.name)}`, `
        <div class="alert alert-info text-sm">Torna attivo con il suo storico e i suoi eventuali debiti. Scegli il turno:</div>
        <div class="shift-pick">
            ${SHIFTS.map(s => `<button class="shift-opt ${m.shift===s?'selected':''}" onclick="App.doReactivate('${memberId}','${s}')">${s}</button>`).join('')}
        </div>
    `);
};
App.doReactivate = async function(memberId, shift) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    try {
        const updates = {};
        updates[`bar-data/members/${memberId}/removed`] = null;
        updates[`bar-data/members/${memberId}/removedAt`] = null;
        updates[`bar-data/members/${memberId}/removedReason`] = null;
        updates[`bar-data/members/${memberId}/shift`] = shift;
        if (m.userId && this.users.some(u => u.uid === m.userId)) {
            updates[`users/${m.userId}/role`] = 'vigile';
            updates[`users/${m.userId}/shift`] = shift;
        }
        await db.ref().update(updates);
        modalClose();
        alert(`✅ ${m.name} di nuovo attivo nel turno ${shift}`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// ---- Admin pannello (Referente): nomina primi admin + migrazione account ----
App.page_ref_admin = function() {
    const vigiliSenzaLink = this.active().filter(m => !m.userId);
    const usersNonLinked = this.users.filter(u => !this.members.some(m => m.userId === u.uid));

    return `
        <h2>👑 Pannello Admin</h2>

        <div class="text-sm text-gray mb-1">Un admin per turno viene nominato da te. Da lì, lui/lei può nominare altri admin del proprio turno.</div>
        ${SHIFTS.map(sh => {
            const admins = this.users.filter(u => u.role === 'admin' && u.shift === sh);
            const vigiliTurno = this.users.filter(u => isVigileRole(u.role) && u.shift === sh);
            return `
                <details class="collapsible-section">
                    <summary>Turno ${sh} — ${admins.length} admin${admins.length===1?'':''}</summary>
                    <div class="collapsible-body">
                        ${admins.length === 0 ? '<div class="alert alert-warn">Nessun admin assegnato</div>' :
                            admins.map(a => `
                                <div class="item-row">
                                    <div class="item-main"><strong>${escapeHtml(a.name)}</strong><br><span class="item-sub">${escapeHtml(a.email)}</span></div>
                                    <button class="btn btn-light btn-sm" onclick="App.setRole('${a.uid}','vigile')">Rimuovi</button>
                                </div>
                            `).join('')}
                        ${vigiliTurno.length > 0 ? `
                            <div class="divider"></div>
                            <div class="text-sm font-bold mb-1">Vigili del turno ${sh} (da promuovere)</div>
                            ${vigiliTurno.map(v => `
                                <div class="item-row">
                                    <div class="item-main"><strong>${escapeHtml(v.name)}</strong><br><span class="item-sub">${escapeHtml(v.email)}</span></div>
                                    <button class="btn btn-blue btn-sm" onclick="App.setRole('${v.uid}','admin')">Nomina admin</button>
                                </div>
                            `).join('')}
                        ` : '<p class="text-sm text-gray">Nessun vigile registrato per questo turno</p>'}
                    </div>
                </details>
            `;
        }).join('')}

        <div class="divider"></div>
        <h3>🔗 Collegamento account ↔ vigili</h3>
        <div class="text-sm text-gray mb-1">Collega account registrati ai vigili dell'elenco cartaceo per portare il loro storico.</div>
        <button class="btn btn-light btn-sm mb-1" onclick="App._refreshUsers()">🔄 Ricarica utenti</button>

        ${usersNonLinked.length > 0 ? `
            <details class="collapsible-section" open>
                <summary>📱 Account disponibili (${usersNonLinked.length})</summary>
                <div class="collapsible-body">
                    ${usersNonLinked.map(u => `
                        <div class="item-row">
                            <div class="item-main">
                                <div class="item-title">${escapeHtml(u.name)} ${u.shift?'<span class="chip chip-shift">T'+u.shift+'</span>':''}</div>
                                <div class="item-sub">${escapeHtml(u.email)}</div>
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-blue btn-sm" onclick="App.modalLinkUser('${u.uid}')">Collega</button>
                                ${u.role !== 'referente' && u.role !== 'super_admin' ? `<button class="btn btn-green btn-sm" onclick="App.createMemberFromUser('${u.uid}')">Nuovo</button>` : ''}
                                ${u.role !== 'referente' ? `<button class="btn btn-sm" style="background:#fee2e2;color:#991b1b" onclick="App.deleteUser('${u.uid}','${escapeAttr(u.name)}','${escapeAttr(u.email)}')">🗑️</button>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </details>
        ` : '<div class="alert alert-ok">✅ Tutti gli account registrati sono collegati ai vigili</div>'}

        <details class="collapsible-section">
            <summary>👥 Vigili da collegare (${vigiliSenzaLink.length})</summary>
            <div class="collapsible-body">
                ${vigiliSenzaLink.length === 0 ? '<div class="alert alert-ok">✅ Tutti i vigili sono collegati</div>' :
                    vigiliSenzaLink.map(m => `
                        <div class="item-row">
                            <div class="item-main">
                                <div class="item-title">${escapeHtml(m.name)} <span class="chip chip-shift">T${m.shift||'?'}</span></div>
                                <div class="item-sub">${(m.balancePerBar||{})[m.shift]>0 ? 'Debito €'+((m.balancePerBar||{})[m.shift]||0).toFixed(2) : 'Nessun debito'}</div>
                            </div>
                            <button class="btn btn-blue btn-sm" onclick="App.modalLinkMember('${m.id}','${escapeAttr(m.name)}')">Collega</button>
