// ============ PAGAMENTO DEBITO (vigile) ============
App.modalPay = function() {
    const me = this.myMember();
    const sh = Auth.myShift();
    if (!me || !sh) return;
    const debt = (me.balancePerBar || {})[sh] || 0;
    if (debt <= 0) return;
    modal('💵 Salda il tuo debito', `
        <div class="alert alert-info">Debito nel Bar T${sh}: <strong class="color-orange">€${debt.toFixed(2)}</strong></div>
        <div class="alert alert-warn text-sm">⚠️ Confermi di aver <strong>messo fisicamente i soldi nella cassa del bar</strong>?</div>
        <div class="form-group">
            <label>Quanto stai pagando?</label>
            <input type="number" id="pay-amt" step="0.50" min="0.50" max="${debt.toFixed(2)}" value="${debt.toFixed(2)}">
        </div>
        <div class="flex">
            <button class="btn btn-green" style="flex:1" onclick="App.doPay('${me.id}','${sh}',false)">💰 Paga importo</button>
            <button class="btn btn-red" style="flex:1" onclick="App.doPay('${me.id}','${sh}',true)">✅ Salda tutto</button>
        </div>
    `);
};

App.modalPayFromAdmin = function(memberId) {
    const sh = Auth.myShift();
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    const debt = (m.balancePerBar || {})[sh] || 0;
    if (debt <= 0) return;
    modal('💵 Registra pagamento', `
        <div class="alert alert-info">${escapeHtml(m.name)} — Debito: <strong class="color-orange">€${debt.toFixed(2)}</strong></div>
        <div class="form-group">
            <label>Importo versato</label>
            <input type="number" id="pay-amt" step="0.50" min="0.50" max="${debt.toFixed(2)}" value="${debt.toFixed(2)}">
        </div>
        <div class="flex">
            <button class="btn btn-green" style="flex:1" onclick="App.doPay('${memberId}','${sh}',false)">💰 Pago</button>
            <button class="btn btn-red" style="flex:1" onclick="App.doPay('${memberId}','${sh}',true)">✅ Salda tutto</button>
        </div>
    `);
};

App.doPay = async function(memberId, shift, payAll) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    const currDebt = (m.balancePerBar || {})[shift] || 0;
    let amount = payAll ? currDebt : (parseFloat(document.getElementById('pay-amt').value) || 0);
    if (amount <= 0) { alert('Importo non valido'); return; }
    if (amount > currDebt) amount = currDebt;
    if (!confirm(`Confermi €${amount.toFixed(2)} messi in cassa?`)) return;
    try {
        // Il debito si scala in modo atomico (se nel frattempo è stato fatto un acquisto a credito non si perde)
        const resDebt = await db.ref(`bar-data/members/${memberId}/balancePerBar/${shift}`).transaction(c => r2(Math.max(0, (c||0) - amount)));
        const newBal = resDebt.snapshot ? (resDebt.snapshot.val() || 0) : Math.max(0, currDebt - amount);
        await db.ref(`bar-data/bars/${shift}/cassa`).transaction(c => r2((c||0) + amount));
        if (newBal === 0) {
            const updates = {};
            this.transactions.forEach(t => {
                // le transazioni pre-riforma restano legate al debito verso il fondo, non al bar
                if (t.memberId === memberId && t.shift === shift && !t.paid && !t.preRiforma) {
                    updates['bar-data/transactions/' + t.id + '/paid'] = true;
                }
            });
            if (Object.keys(updates).length > 0) await db.ref().update(updates);
        }
        const pId = uid();
        await db.ref(`bar-data/purchases/${pId}`).set({
            id: pId, shift,
            description: `💵 Pagamento debito di ${m.name} (€${amount.toFixed(2)})`,
            amount: 0, qty: 0, cashDelta: amount,
            productId: null, productName: null,
            isCoffee: false, isAdjustment: true,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ €${amount.toFixed(2)} registrati!${newBal>0?'\nDebito residuo: €'+newBal.toFixed(2):''}`);
    } catch(e) { console.error(e); alert('Errore: ' + e.message); }
};

// ============ PAGAMENTO DEBITO PRE-RIFORMA → FONDO ============
App.modalPayFondo = function(memberId) {
    let m;
    if (memberId) {
        m = this.members.find(x => x.id === memberId);
    } else {
        m = this.myMember();
    }
    if (!m) return;
    const debt = m.debitoFondo || 0;
    if (debt <= 0) return;
    modal('💰 Saldo debito pre-riforma', `
        <div class="alert alert-info">
            <strong>${escapeHtml(m.name)}</strong><br>
            Debito pre-riforma: <strong class="color-orange">€${debt.toFixed(2)}</strong>
        </div>
        <div class="alert alert-warn text-sm">
            ⚠️ Questo debito viene dalla gestione prima della divisione dei turni.<br>
            I soldi vanno nel <strong>fondo distaccamento</strong>, non nella cassa del bar.
        </div>
        <div class="form-group">
            <label>Importo versato</label>
            <input type="number" id="pay-amt" step="0.50" min="0.50" max="${debt.toFixed(2)}" value="${debt.toFixed(2)}">
        </div>
        <div class="flex">
            <button class="btn btn-green" style="flex:1" onclick="App.doPayFondo('${m.id}',false)">💰 Pago</button>
            <button class="btn btn-red" style="flex:1" onclick="App.doPayFondo('${m.id}',true)">✅ Salda tutto</button>
        </div>
    `);
};

App.doPayFondo = async function(memberId, payAll) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    const currDebt = m.debitoFondo || 0;
    let amount = payAll ? currDebt : (parseFloat(document.getElementById('pay-amt').value) || 0);
    if (amount <= 0) { alert('Importo non valido'); return; }
    if (amount > currDebt) amount = currDebt;
    if (!confirm(`Confermi €${amount.toFixed(2)} versati nel FONDO distaccamento (non nel bar)?`)) return;
    try {
        // Debito ↓ e fondo ↑ (atomici)
        const resDebt = await db.ref(`bar-data/members/${memberId}/debitoFondo`).transaction(c => r2(Math.max(0, (c||0) - amount)));
        const newDebt = resDebt.snapshot ? (resDebt.snapshot.val() || 0) : Math.max(0, currDebt - amount);
        await db.ref('bar-data/fondoDistaccamento/saldo').transaction(c => r2((c||0) + amount));
        // Debito pre-riforma chiuso → le vecchie consumazioni risultano pagate
        if (newDebt === 0) {
            const updates = {};
            this.transactions.forEach(t => {
                if (t.memberId === memberId && t.preRiforma && !t.paid) updates['bar-data/transactions/' + t.id + '/paid'] = true;
            });
            if (Object.keys(updates).length > 0) await db.ref().update(updates);
        }
        // Movimento nel fondo per tracciabilità
        const mId = uid();
        await db.ref(`bar-data/fondoDistaccamento/movimenti/${mId}`).set({
            id: mId,
            tipo: 'saldo-pre-riforma',
            importo: amount,
            descrizione: `Saldo pre-riforma di ${m.name}` + (newDebt > 0 ? ` (residuo €${newDebt.toFixed(2)})` : ' (saldato)'),
            date: new Date().toISOString(),
            registeredBy: Auth.user.name,
            registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ €${amount.toFixed(2)} versati al fondo!${newDebt>0?'\nDebito pre-riforma residuo: €'+newDebt.toFixed(2):''}`);
    } catch(e) { console.error(e); alert('Errore: ' + e.message); }
};

// ============ CARICO MERCE ============
App.modalCarico = function(prodId) {
    const sh = Auth.myShift();
    const prod = (this.products[sh] || []).find(p => p.id === prodId);
    if (!prod) return;
    modal(`📥 Carica ${escapeHtml(prod.name)}`, `
        <div class="form-group"><label>Quantità pezzi</label><input type="number" id="car-qty" min="1" value="1"></div>
        <div class="form-group"><label>Costo totale pagato (€)</label><input type="number" id="car-amt" step="0.50" min="0" value="0"></div>
        <div class="alert alert-warn text-sm">L'importo verrà scalato dalla cassa del tuo bar.</div>
        <button class="btn btn-red btn-full" onclick="App.doCarico('${prod.id}','${sh}')">Conferma carico</button>
    `);
};

App.doCarico = async function(prodId, shift) {
    const prod = (this.products[shift] || []).find(p => p.id === prodId);
    if (!prod) return;
    const qty = parseInt(document.getElementById('car-qty').value) || 0;
    const amt = parseFloat(document.getElementById('car-amt').value) || 0;
    if (qty <= 0) { alert('Quantità non valida'); return; }
    if (amt < 0) { alert('Importo non valido'); return; }
    try {
        await db.ref(`bar-data/products/${shift}/${prod.id}/stock`).transaction(c => (c||0) + qty);
        if (amt > 0) {
            await db.ref(`bar-data/bars/${shift}/cassa`).transaction(c => r2((c||0) - amt));
        }
        const pId = uid();
        await db.ref(`bar-data/purchases/${pId}`).set({
            id: pId, shift,
            description: `Carico ${qty}× ${prod.name}`,
            amount: amt, qty, cashDelta: -amt,
            productId: prod.id, productName: prod.name,
            isCoffee: !!prod.isCoffee, isAdjustment: false,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ Caricati ${qty} × ${prod.name}`);
    } catch(e) { console.error(e); alert('Errore: ' + e.message); }
};

// ============ NUOVO / MODIFICA PRODOTTO ============
App.modalNewProduct = function() {
    const sh = Auth.myShift();
    modal('➕ Nuovo prodotto', `
        <div class="alert alert-info text-sm">Il prodotto sarà solo del tuo bar (Turno ${sh}).</div>
        <div class="form-group"><label>Nome prodotto</label><input type="text" id="np-name" placeholder="Es: Trinca, Coca..."></div>
        <div class="form-group"><label>Prezzo (€)</label><input type="number" id="np-price" step="0.10" min="0" value="0.50"></div>
        <div class="form-group">
            <label>Tipo</label>
            <div class="flex">
                <button type="button" id="np-coffee-y" class="btn btn-warn" style="flex:1" onclick="App._pickCoffee(true)">☕ Caffè</button>
                <button type="button" id="np-coffee-n" class="btn btn-light" style="flex:1" onclick="App._pickCoffee(false)">🍫 Altro</button>
            </div>
            <input type="hidden" id="np-coffee" value="true">
        </div>
        <div class="form-group"><label>Scorta iniziale (opzionale)</label><input type="number" id="np-stock" min="0" value="0"></div>
        <button class="btn btn-red btn-full" onclick="App.doNewProduct()">Crea prodotto</button>
    `);
};

App._pickCoffee = function(isCoffee) {
    document.getElementById('np-coffee').value = isCoffee ? 'true' : 'false';
    document.getElementById('np-coffee-y').className = isCoffee ? 'btn btn-warn' : 'btn btn-light';
    document.getElementById('np-coffee-n').className = isCoffee ? 'btn btn-light' : 'btn btn-warn';
    document.getElementById('np-coffee-y').style.flex = '1';
    document.getElementById('np-coffee-n').style.flex = '1';
};

App.doNewProduct = async function() {
    const sh = Auth.myShift();
    const name = document.getElementById('np-name').value.trim();
    const price = parseFloat(document.getElementById('np-price').value) || 0;
    const stock = parseInt(document.getElementById('np-stock').value) || 0;
    const isCoffee = document.getElementById('np-coffee').value === 'true';
    if (!name) { alert('Inserisci nome'); return; }
    if (price <= 0) { alert('Prezzo non valido'); return; }
    try {
        const id = uid();
        await db.ref(`bar-data/products/${sh}/${id}`).set({
            id, name, price, isCoffee, stock
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert('✅ Prodotto creato!');
    } catch(e) { alert('Errore: ' + e.message); }
};

App.modalEditProduct = function(prodId) {
    const sh = Auth.myShift();
    const prod = (this.products[sh] || []).find(p => p.id === prodId);
    if (!prod) return;
    modal(`✏️ Modifica ${escapeHtml(prod.name)}`, `
        <div class="form-group"><label>Nome</label><input type="text" id="ep-name" value="${escapeAttr(prod.name)}"></div>
        <div class="form-group"><label>Prezzo (€)</label><input type="number" id="ep-price" step="0.10" value="${prod.price}"></div>
        <div class="form-group"><label>Scorta attuale</label><input type="number" id="ep-stock" min="0" value="${prod.stock||0}"></div>
        <button class="btn btn-red btn-full" onclick="App.doEditProduct('${prodId}')">Salva</button>
    `);
};

App.doEditProduct = async function(prodId) {
    const sh = Auth.myShift();
    const name = document.getElementById('ep-name').value.trim();
    const price = parseFloat(document.getElementById('ep-price').value) || 0;
    const stock = parseInt(document.getElementById('ep-stock').value) || 0;
    if (!name || price <= 0) { alert('Dati non validi'); return; }
    try {
        await db.ref(`bar-data/products/${sh}/${prodId}`).update({ name, price, stock });
        modalClose();
        alert('✅ Modificato');
    } catch(e) { alert('Errore: ' + e.message); }
};

App.deleteProduct = async function(prodId) {
    const sh = Auth.myShift();
    const prod = (this.products[sh] || []).find(p => p.id === prodId);
    if (!prod) return;
    if (!confirm(`Eliminare "${prod.name}"?`)) return;
    try {
        await db.ref(`bar-data/products/${sh}/${prodId}`).remove();
        alert('✅ Eliminato');
    } catch(e) { alert('Errore: ' + e.message); }
};
</script>
<script>
// =============================================
// MODALI REFERENTE + VERSA QUOTA + VENDITA OSPITE/ESTERNO
// =============================================

// ============ VERSA QUOTA MENSILE ============
App.modalVersaQuota = function() {
    const sh = Auth.myShift();
    if (!sh) return;
    const bar = this.bars[sh];
    const unpaid = this.unpaidMonths(sh);
    if (unpaid.length === 0) { alert('✅ Le quote del tuo bar sono già tutte versate.'); return; }
    const meseYM = unpaid[0]; // si salda sempre il mese più vecchio
    const quota = this.fondo.quotaMensile;
    if (bar.cassa < quota) {
        if (!confirm(`⚠️ La cassa del bar (€${bar.cassa.toFixed(2)}) è INFERIORE alla quota (€${quota.toFixed(2)}).\nProcedere comunque? La cassa andrà in negativo.`)) return;
    }
    modal('💰 Versa quota al fondo', `
        <div class="alert alert-info">
            <strong>${escapeHtml(bar.name)}</strong><br>
            Quota di <strong>${formatMonth(meseYM)}</strong>: <strong>€${quota.toFixed(2)}</strong>
            ${unpaid.length > 1 ? `<br><span class="text-sm">Restano da versare anche: ${unpaid.slice(1).map(formatMonth).join(', ')}</span>` : ''}
        </div>
        <div class="alert alert-warn">
            Cassa Bar T${sh}: <strong>€${bar.cassa.toFixed(2)}</strong> → <strong>€${(bar.cassa-quota).toFixed(2)}</strong><br>
            Fondo distaccamento: <strong>€${this.fondo.saldo.toFixed(2)}</strong> → <strong class="color-green">€${(this.fondo.saldo+quota).toFixed(2)}</strong>
        </div>
        <button class="btn btn-green btn-full" onclick="App.doVersaQuota('${sh}','${meseYM}')">✅ Conferma versamento €${quota.toFixed(2)}</button>
    `);
};

App.doVersaQuota = async function(shift, meseYM) {
    const quota = this.fondo.quotaMensile;
    const mese = meseYM || currentMonth();
    try {
        // 1) Prenoto il mese in modo atomico: se un altro admin l'ha appena versato, mi fermo (niente doppio versamento)
        const res = await db.ref(`bar-data/bars/${shift}/quotaMese/${mese}`).transaction(curr => {
            if (curr === 'pagata') return; // abort
            return 'pagata';
        });
        if (!res.committed) { modalClose(); alert('Questa quota risulta già versata da un altro admin.'); return; }
        // 2) Sposto i soldi: cassa bar ↓, fondo ↑
        await db.ref(`bar-data/bars/${shift}/cassa`).transaction(c => r2((c||0) - quota));
        await db.ref('bar-data/fondoDistaccamento/saldo').transaction(c => r2((c||0) + quota));
        await db.ref(`bar-data/bars/${shift}/sollecito`).set(null);
        const mId = uid();
        await db.ref(`bar-data/fondoDistaccamento/movimenti/${mId}`).set({
            id: mId, tipo: 'quota', importo: quota,
            descrizione: `Quota ${formatMonth(mese)} · Turno ${shift}`,
            turno: shift, mese,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        const pId = uid();
        await db.ref(`bar-data/purchases/${pId}`).set({
            id: pId, shift,
            description: `💰 Quota ${formatMonth(mese)} versata al fondo`,
            amount: quota, qty: 0, cashDelta: -quota,
            productId: null, productName: null, isCoffee: false, isAdjustment: true,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ Quota di ${formatMonth(mese)} (€${quota.toFixed(2)}) versata al fondo!`);
    } catch(e) { console.error(e); alert('Errore: ' + e.message); }
};

// ============ SOLLECITO (Referente → admin del turno) ============
App.sollecita = async function(shift) {
    if (!Auth.isReferente()) return;
    if (!confirm(`Inviare un sollecito agli admin del Turno ${shift}?\nVedranno un avviso nella loro home finché non versano.`)) return;
    try {
        await db.ref(`bar-data/bars/${shift}/sollecito`).set({ date: new Date().toISOString(), by: Auth.user.name });
        alert('🔔 Sollecito inviato');
    } catch(e) { alert('Errore: ' + e.message); }
};

// ============ SPESA FONDO (Referente) ============
App.modalRefSpesaFondo = function() {
    modal('📝 Nuova spesa dal fondo', `
        <div class="alert alert-info text-sm">Solo tu (Referente) puoi registrare spese dal fondo.</div>
        <div class="form-group"><label>Descrizione</label><input type="text" id="sf-desc" placeholder="Es: Bolletta luce, manutenzione..."></div>
        <div class="form-group">
            <label>Categoria</label>
            <select id="sf-cat">
                <option>Utenze</option>
                <option>Manutenzione</option>
                <option>Acquisti comuni</option>
                <option>Altro</option>
            </select>
        </div>
        <div class="form-group"><label>Importo (€)</label><input type="number" id="sf-amt" step="0.50" min="0.50" placeholder="0,00"></div>
        <div class="form-group">
            <label>Tipo movimento</label>
            <div class="flex">
                <button type="button" id="sf-type-spesa" class="btn btn-red" style="flex:1" onclick="App._pickFondoType('spesa')">🔴 Spesa</button>
                <button type="button" id="sf-type-entrata" class="btn btn-light" style="flex:1" onclick="App._pickFondoType('entrata')">🟢 Entrata</button>
            </div>
            <input type="hidden" id="sf-type" value="spesa">
        </div>
        <button class="btn btn-red btn-full" id="sf-confirm" onclick="App.doRefSpesaFondo()">Registra spesa</button>
    `);
};

App._pickFondoType = function(type) {
    document.getElementById('sf-type').value = type;
    const spesa = document.getElementById('sf-type-spesa');
    const entrata = document.getElementById('sf-type-entrata');
    const btn = document.getElementById('sf-confirm');
    if (type === 'spesa') {
        spesa.className = 'btn btn-red'; entrata.className = 'btn btn-light';
        spesa.style.flex = '1'; entrata.style.flex = '1';
        btn.className = 'btn btn-red btn-full'; btn.textContent = 'Registra spesa';
    } else {
        spesa.className = 'btn btn-light'; entrata.className = 'btn btn-green';
        spesa.style.flex = '1'; entrata.style.flex = '1';
        btn.className = 'btn btn-green btn-full'; btn.textContent = 'Registra entrata';
    }
};

App.doRefSpesaFondo = async function() {
    const desc = document.getElementById('sf-desc').value.trim();
    const cat = document.getElementById('sf-cat').value;
    const amt = parseFloat(document.getElementById('sf-amt').value) || 0;
    const type = document.getElementById('sf-type').value;
    if (!desc || amt <= 0) { alert('Dati non validi'); return; }
    const sign = type === 'entrata' ? 1 : -1;
    try {
        await db.ref('bar-data/fondoDistaccamento/saldo').transaction(c => r2((c||0) + sign * amt));
        const mId = uid();
        await db.ref(`bar-data/fondoDistaccamento/movimenti/${mId}`).set({
            id: mId,
            tipo: type,
            importo: sign * amt,
            descrizione: desc,
            categoria: cat,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name,
            registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ ${type === 'entrata' ? 'Entrata' : 'Spesa'} di €${amt.toFixed(2)} registrata`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// ============ IMPOSTA QUOTA MENSILE ============
App.modalRefSetQuota = function() {
    modal('⚙️ Quota mensile', `
        <div class="alert alert-info">La quota mensile che ogni turno versa al fondo. Modificabile in qualsiasi momento.</div>
        <div class="form-group"><label>Quota (€/mese)</label><input type="number" id="qm-amt" step="1" min="0" value="${this.fondo.quotaMensile}"></div>
        <button class="btn btn-red btn-full" onclick="App.doSetQuota()">Salva</button>
    `);
};
App.doSetQuota = async function() {
    const v = parseFloat(document.getElementById('qm-amt').value) || 0;
    if (v < 0) return;
    try {
        await db.ref('bar-data/fondoDistaccamento/quotaMensile').set(v);
        modalClose();
        alert(`✅ Quota impostata a €${v.toFixed(2)}`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// ============ REFERENTE: SALDA DEBITI ============
App.modalRefSalda = function(shift) {
    const me = this.myMember();
    if (!me) return;
    const debt = (me.balancePerBar || {})[shift] || 0;
    if (debt <= 0) return;
    modal(`💵 Salda Bar T${shift}`, `
        <div class="alert alert-info">Debito: <strong class="color-orange">€${debt.toFixed(2)}</strong></div>
        <div class="form-group"><label>Importo</label><input type="number" id="pay-amt" step="0.50" min="0.50" max="${debt.toFixed(2)}" value="${debt.toFixed(2)}"></div>
        <div class="flex">
            <button class="btn btn-green" style="flex:1" onclick="App.doPay('${me.id}','${shift}',false)">💰 Pago importo</button>
            <button class="btn btn-red" style="flex:1" onclick="App.doPay('${me.id}','${shift}',true)">✅ Salda tutto</button>
        </div>
    `);
};

App.modalRefSaldaAll = function() {
    const me = this.myMember();
    if (!me) return;
    const bpb = me.balancePerBar || {};
    const totale = SHIFTS.reduce((s,sh) => s + (bpb[sh]||0), 0);
    if (!confirm(`Saldare tutti i tuoi debiti? Totale €${totale.toFixed(2)}\nI soldi andranno nelle casse dei rispettivi bar.`)) return;
    (async () => {
        for (const sh of SHIFTS) {
            const d = bpb[sh] || 0;
            if (d > 0) {
                try {
                    await db.ref(`bar-data/bars/${sh}/cassa`).transaction(c => r2((c||0) + d));
                    await db.ref(`bar-data/members/${me.id}/balancePerBar/${sh}`).transaction(c => r2(Math.max(0, (c||0) - d)));
                    const updates = {};
                    this.transactions.forEach(t => {
                        if (t.memberId === me.id && t.shift === sh && !t.paid && !t.preRiforma) {
                            updates['bar-data/transactions/' + t.id + '/paid'] = true;
                        }
                    });
                    if (Object.keys(updates).length > 0) await db.ref().update(updates);
                    const pId = uid();
                    await db.ref(`bar-data/purchases/${pId}`).set({
                        id: pId, shift: sh,
                        description: `💵 Saldo Referente (€${d.toFixed(2)})`,
                        amount: 0, qty: 0, cashDelta: d,
                        productId: null, productName: null,
                        isCoffee: false, isAdjustment: true,
                        date: new Date().toISOString(),
                        registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
                    });
                } catch(e) { console.error(e); }
            }
        }
        alert(`✅ Debiti saldati per €${totale.toFixed(2)}`);
    })();
};

// ============ REFERENTE: COMPRA COME OSPITE ============
App.modalRefBuyGuest = function() {
    const bars = SHIFTS.filter(s => this.bars[s] && this.bars[s].allowGuests && (this.products[s]||[]).length > 0);
    if (bars.length === 0) { alert('Nessun bar accetta ospiti al momento'); return; }
    modal('🧳 Compra come ospite', `
        <div class="alert alert-info text-sm">Scegli il bar dove ti trovi. Puoi pagare cash o a credito (solo tu come Referente).</div>
        ${bars.map(s => `
            <button class="btn btn-light btn-full mb-1" onclick="App._refPickBar('${s}')">
                🏪 ${escapeHtml(this.bars[s].name)}
            </button>
        `).join('')}
    `);
};
App._refPickBar = function(shift) {
    const prodotti = this.products[shift] || [];
    modal(`🛒 Ospite nel ${escapeHtml(this.bars[shift].name)}`, `
        <div class="alert alert-info text-sm">Come Referente puoi pagare subito o a credito. Il debito resta localizzato nel bar T${shift}.</div>
        <div class="product-grid">
            ${prodotti.filter(p => (p.stock||0) > 0).map(p => `
                <div class="p-card ${p.isCoffee?'coffee':''}">
                    <div class="name">${escapeHtml(p.name)}</div>
                    <div class="price">€${p.price.toFixed(2)}</div>
                    <div class="stock stock-ok">Stock: ${p.stock}</div>
                    <div class="flex">
                        ${this.bars[shift].allowCredit ? `<button class="btn btn-orange btn-sm" style="flex:1" onclick="App.modalBuyAsGuest('${p.id}','${shift}',false)">Credito</button>` : ''}
                        <button class="btn btn-green btn-sm" style="flex:1" onclick="App.modalBuyAsGuest('${p.id}','${shift}',true)">Paga</button>
                    </div>
                </div>
            `).join('') || '<p class="text-gray text-center">Nessun prodotto disponibile</p>'}
        </div>
    `);
};

App.modalBuyAsGuest = function(prodId, shift, payNow) {
    const me = this.myMember();
    if (!me) { alert('Il tuo account non è collegato a un member'); return; }
    const prod = (this.products[shift] || []).find(p => p.id === prodId);
    if (!prod) return;
    const maxAvail = prod.stock || 0;
    if (maxAvail <= 0) return;

    modal(`🛒 ${escapeHtml(prod.name)} (Bar T${shift})`, `
        <div class="alert alert-info">Come ospite · €${prod.price.toFixed(2)} · Disp. ${maxAvail}</div>
        <div class="alert ${payNow?'alert-ok':'alert-warn'}"><strong>${payNow?'💵 Pagamento immediato':'📝 A credito (Referente)'}</strong></div>
        <div class="form-group">
            <label>Quantità</label>
            <div class="flex" style="align-items:center">
                <button type="button" class="btn btn-light btn-icon" onclick="App._qtyChange(-1,${maxAvail})">−</button>
                <input type="number" id="buy-qty" min="1" max="${maxAvail}" value="1" oninput="App._qtyUpdate(${maxAvail},${prod.price})" style="flex:1;text-align:center;font-weight:700">
                <button type="button" class="btn btn-light btn-icon" onclick="App._qtyChange(1,${maxAvail})">+</button>
            </div>
        </div>
        <div class="alert alert-info text-sm" id="buy-preview">Totale: €${prod.price.toFixed(2)}</div>
        <button class="btn ${payNow?'btn-green':'btn-orange'} btn-full" onclick="App.doGuestBuy('${prodId}','${shift}',${payNow})">Conferma</button>
    `);
};

App.doGuestBuy = async function(prodId, shift, payNow) {
    const me = this.myMember();
    if (!me) return;
    const prod = (this.products[shift] || []).find(p => p.id === prodId);
    if (!prod) return;
    if (!payNow && !(Auth.isReferente() && this.bars[shift].allowCredit)) { alert('Come ospite si paga solo subito.'); return; }
    const qty = parseInt(document.getElementById('buy-qty').value) || 1;
    const totalPrice = r2(qty * prod.price);
    try {
        if (!(await takeStock(shift, prod.id, qty))) { alert('⚠️ Scorte insufficienti: qualcuno ha appena preso questo prodotto. Riprova.'); return; }
        if (payNow) {
            await db.ref(`bar-data/bars/${shift}/cassa`).transaction(c => r2((c||0) + totalPrice));
        } else {
            await db.ref(`bar-data/members/${me.id}/balancePerBar/${shift}`).transaction(c => r2((c||0) + totalPrice));
        }
        const txId = uid();
        await db.ref(`bar-data/transactions/${txId}`).set({
            id: txId, shift,
            memberId: me.id, memberName: me.name,
            productId: prod.id, productName: prod.name,
            price: totalPrice, unitPrice: prod.price, quantity: qty,
            paid: payNow, isCoffee: !!prod.isCoffee,
            isGuest: true, isExternal: false,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ Acquistato come ospite nel Bar T${shift}`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// ============ VENDITA OSPITE (vigile) → in altro turno ============
App.modalBuyGuest = function() {
    const sh = Auth.myShift();
    const otherBars = SHIFTS.filter(s => s !== sh && this.bars[s] && this.bars[s].allowGuests && (this.products[s]||[]).length > 0);
    if (otherBars.length === 0) { alert('Nessun altro bar accetta ospiti al momento'); return; }
    modal('🧳 Compra come ospite in altro turno', `
        <div class="alert alert-info text-sm">Scegli il bar dove sei in sostituzione. Pagamento solo immediato.</div>
        ${otherBars.map(s => `
            <button class="btn btn-light btn-full mb-1" onclick="App._userGuestPick('${s}')">
                🏪 ${escapeHtml(this.bars[s].name)}
            </button>
        `).join('')}
    `);
};
App._userGuestPick = function(shift) {
    const prodotti = (this.products[shift] || []).filter(p => (p.stock||0) > 0);
    modal(`🛒 Ospite nel ${escapeHtml(this.bars[shift].name)}`, `
        <div class="alert alert-warn text-sm">Come ospite di altro turno paghi solo cash. I soldi vanno nel bar T${shift}.</div>
        ${prodotti.length === 0 ? '<p class="text-gray text-center">Nessun prodotto disponibile</p>' : `
            <div class="product-grid">
                ${prodotti.map(p => `
                    <div class="p-card ${p.isCoffee?'coffee':''}">
                        <div class="name">${escapeHtml(p.name)}</div>
                        <div class="price">€${p.price.toFixed(2)}</div>
                        <div class="stock stock-ok">Stock: ${p.stock}</div>
                        <button class="btn btn-green btn-sm btn-full" onclick="App.modalBuyAsGuest('${p.id}','${shift}',true)">💵 Prendi</button>
                    </div>
                `).join('')}
            </div>
        `}
    `);
};

// ============ VENDITA A ESTERNO ============
App.modalExternal = function() {
    const sh = Auth.myShift();
    if (!sh) return;
    const prodotti = (this.products[sh] || []).filter(p => (p.stock||0) > 0);
    if (prodotti.length === 0) { alert('Nessun prodotto disponibile'); return; }
    const vigiliTurno = this.active().filter(m => m.shift === sh).sort((a,b) => a.name.localeCompare(b.name));
    // Referente può offrire
    const refMembers = this.members.filter(m => (this.users.find(u => u.uid === m.userId) || {}).role === 'referente');
    const offerentiOptions = [...vigiliTurno, ...refMembers];

    modal('👤 Vendita a esterno (altra sede)', `
        <div class="alert alert-info text-sm">Per persone da altre sedi che non usano l'app.</div>
        <div class="form-group"><label>Chi è (opzionale)</label><input type="text" id="ex-who" placeholder="Es: Caposquadra Siracusa"></div>
        <div class="flex">
            <div class="form-group" style="flex:2">
                <label>Prodotto</label>
                <select id="ex-prod">
                    ${prodotti.map(p => `<option value="${p.id}">${escapeHtml(p.name)} — €${p.price.toFixed(2)}</option>`).join('')}
                </select>
            </div>
            <div class="form-group" style="flex:1">
                <label>Qtà</label>
                <input type="number" id="ex-qty" min="1" value="1">
            </div>
        </div>
        <div class="form-group">
            <label>Chi paga?</label>
            <div class="flex">
                <button type="button" id="ex-pay-external" class="btn btn-green" style="flex:1" onclick="App._pickExtPayer('external')">💵 L'esterno</button>
                <button type="button" id="ex-pay-offered" class="btn btn-light" style="flex:1" onclick="App._pickExtPayer('offered')">🎁 Lo offre un vigile</button>
            </div>
            <input type="hidden" id="ex-pay" value="external">
        </div>
        <div class="form-group hidden" id="ex-offerente-wrap">
            <label>Chi offre?</label>
            <select id="ex-offerente">
                <option value="">— Scegli —</option>
                ${offerentiOptions.map(m => `<option value="${m.id}">${escapeHtml(m.name)}${(this.users.find(u => u.uid === m.userId) || {}).role === 'referente' ? ' (Referente)' : ''}</option>`).join('')}
            </select>
            <div class="text-sm text-gray mt-1">L'importo andrà a debito nel suo conto del Bar T${sh}.</div>
        </div>
        <button class="btn btn-red btn-full" onclick="App.doExternal('${sh}')">Registra vendita</button>
    `);
};

App._pickExtPayer = function(type) {
    document.getElementById('ex-pay').value = type;
    const ext = document.getElementById('ex-pay-external');
    const off = document.getElementById('ex-pay-offered');
    const wrap = document.getElementById('ex-offerente-wrap');
    if (type === 'external') {
        ext.className = 'btn btn-green'; off.className = 'btn btn-light';
        wrap.classList.add('hidden');
    } else {
        ext.className = 'btn btn-light'; off.className = 'btn btn-warn';
        wrap.classList.remove('hidden');
    }
    ext.style.flex = '1'; off.style.flex = '1';
};

App.doExternal = async function(shift) {
    const who = document.getElementById('ex-who').value.trim() || 'Esterno';
    const prodId = document.getElementById('ex-prod').value;
    const qty = parseInt(document.getElementById('ex-qty').value) || 1;
    const payType = document.getElementById('ex-pay').value;
    const prod = (this.products[shift] || []).find(p => p.id === prodId);
    if (!prod) { alert('Prodotto non valido'); return; }
    if ((prod.stock||0) < qty) { alert(`Disponibili solo ${prod.stock||0}`); return; }
    const totalPrice = r2(qty * prod.price);

    let offerenteId = null, offerenteName = null;
    if (payType === 'offered') {
        offerenteId = document.getElementById('ex-offerente').value;
        if (!offerenteId) { alert('Scegli chi offre'); return; }
        const offMember = this.members.find(m => m.id === offerenteId);
        if (!offMember) return;
        offerenteName = offMember.name;
    }

    try {
        if (!(await takeStock(shift, prod.id, qty))) { alert('⚠️ Scorte insufficienti: qualcuno ha appena preso questo prodotto. Riprova.'); return; }
        if (payType === 'external') {
            await db.ref(`bar-data/bars/${shift}/cassa`).transaction(c => r2((c||0) + totalPrice));
        } else {
            // Va a debito dell'offerente nel bar T<shift>
            await db.ref(`bar-data/members/${offerenteId}/balancePerBar/${shift}`).transaction(c => r2((c||0) + totalPrice));
        }
        const txId = uid();
        await db.ref(`bar-data/transactions/${txId}`).set({
            id: txId, shift,
            memberId: offerenteId || 'external',
            memberName: offerenteName || who,
            productId: prod.id, productName: prod.name,
            price: totalPrice, unitPrice: prod.price, quantity: qty,
            paid: payType === 'external',
            isCoffee: !!prod.isCoffee,
            isGuest: false, isExternal: true,
            externalName: who,
            offeredByMemberId: offerenteId,
            offeredByMemberName: offerenteName,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ ${qty}× ${prod.name} a ${who} ${payType === 'external' ? 'pagato' : 'offerto da ' + offerenteName}`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// ============ IMPOSTAZIONI BAR ============
App.saveBarIdentity = async function() {
    const sh = Auth.myShift();
    const name = document.getElementById('bar-name-inp').value.trim();
    const subtitle = document.getElementById('bar-sub-inp').value.trim();
    if (!name) { alert('Nome richiesto'); return; }
    try {
        await db.ref(`bar-data/bars/${sh}`).update({ name, subtitle });
        alert('✅ Salvato');
    } catch(e) { alert('Errore: ' + e.message); }
};

App.toggleBarOption = async function(opt) {
    const sh = Auth.myShift();
    const curr = (this.bars[sh] || {})[opt];
    try {
        await db.ref(`bar-data/bars/${sh}/${opt}`).set(!curr);
    } catch(e) { alert('Errore: ' + e.message); }
};

// ============ AMMINISTRAZIONE ACCOUNT ============
App.setRole = async function(uid, role) {
    const u = this.users.find(x => x.uid === uid);
    if (!u) return;
    if (!confirm(`Cambiare ruolo di ${u.name} da ${u.role} a ${role}?`)) return;
    try {
        await db.ref(`users/${uid}/role`).set(role);
        alert('✅ Ruolo aggiornato');
    } catch(e) { alert('Errore: ' + e.message); }
};

App.deleteUser = async function(uid, name, email) {
    const linked = this.members.find(m => m.userId === uid);
    if (linked) { alert(`Impossibile eliminare: collegato a "${linked.name}". Prima scollega.`); return; }
    if (!confirm(`Eliminare "${name}" (${email})?\n\n⚠️ Dopo dovrai eliminarlo anche da Firebase Authentication.`)) return;
    try {
        await db.ref('users/' + uid).remove();
        alert(`✅ "${name}" eliminato.\n⚠️ Ricordati Firebase Auth!`);
    } catch(e) { alert('Errore: ' + e.message); }
};

App._refreshUsers = async function() {
    try {
        const snap = await db.ref('users').once('value');
        const val = snap.val() || {};
        this.users = Object.entries(val).map(([uid, data]) => ({ uid, ...data }));
        this.render();
        alert(`✅ ${this.users.length} account caricati`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// ============ COLLEGAMENTO MEMBER ↔ USER ============
App.modalLinkUser = function(userUid, userName) {
    const u = this.users.find(x => x.uid === userUid);
    if (!u) return;
    const available = this.active().filter(m => !m.userId && m.shift === u.shift);
    modal(`🔗 Collega "${escapeHtml(u.name)}"`, `
        <div class="alert alert-info">Account <strong>${escapeHtml(u.name)}</strong> (${escapeHtml(u.email)}) · Turno ${u.shift || '?'}</div>
        <div class="text-sm text-gray mb-1">Scegli il vigile dell'elenco da collegare. Lo storico passa al nuovo account.</div>
        ${available.length === 0 ? '<div class="alert alert-warn">Nessun vigile disponibile nel suo turno</div>' :
            available.sort((a,b) => a.name.localeCompare(b.name)).map(m => {
                const dbt = (m.balancePerBar || {})[m.shift] || 0;
                return `
                    <div class="item-row">
                        <div class="item-main">
                            <div class="item-title">${escapeHtml(m.name)}</div>
                            <div class="item-sub">${dbt > 0 ? 'Debito: €'+dbt.toFixed(2) : 'Nessun debito'}</div>
                        </div>
                        <button class="btn btn-blue btn-sm" onclick="App.linkMemberToUser('${m.id}','${userUid}')">Collega</button>
                    </div>
                `;
            }).join('')}
    `);
};

App.modalLinkMember = function(memberId, memberName) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    const available = this.users.filter(u => !this.members.some(mm => mm.userId === u.uid) && (!u.shift || u.shift === m.shift));
    modal(`🔗 Collega "${escapeHtml(m.name)}"`, `
        <div class="alert alert-info">Vigile <strong>${escapeHtml(m.name)}</strong> · Turno ${m.shift || '?'}</div>
        ${available.length === 0 ? '<div class="alert alert-warn">Nessun account disponibile</div>' :
            available.map(u => `
                <div class="item-row">
                    <div class="item-main">
                        <div class="item-title">${escapeHtml(u.name)}</div>
                        <div class="item-sub">${escapeHtml(u.email)}</div>
                    </div>
                    <button class="btn btn-blue btn-sm" onclick="App.linkMemberToUser('${memberId}','${u.uid}')">Collega</button>
                </div>
            `).join('')}
    `);
};

App.linkMemberToUser = async function(memberId, userUid) {
    const m = this.members.find(x => x.id === memberId);
    const u = this.users.find(x => x.uid === userUid);
    if (!m || !u) return;
    if (!confirm(`Collegare "${u.name}" a "${m.name}"?`)) return;
    try {
        await db.ref(`bar-data/members/${memberId}/userId`).set(userUid);
        if (u.role === 'referente' || u.role === 'super_admin') await db.ref(`bar-data/members/${memberId}/shift`).set(null);
        modalClose();
        alert(`✅ Collegati: ${u.name} ↔ ${m.name}`);
    } catch(e) { alert('Errore: ' + e.message); }
};
</script>
<script>
// =============================================
// MIGRAZIONE v2 → v3
// Trasferisce TUTTI i dati senza perdite
// =============================================
const Migration = {
    // Calcola tutto quello che la migrazione farà, senza scrivere nulla
    analyze(old, users) {
        const memberEntries = Object.entries(old.members || {}).filter(([k, m]) => m);
        const refUid = Auth.user.uid;
        const debts = { A:0, B:0, C:0, D:0, NONE:0 };
        const debtCount = { A:0, B:0, C:0, D:0, NONE:0 };
        let debtTotal = 0;
        memberEntries.forEach(([k, m]) => {
            if ((m.name || '').trim().toLowerCase() === 'ospiti') return;
            const bal = r2(m.balance || 0);
            if (bal <= 0) return;
            const key = SHIFTS.includes(m.shift) ? m.shift : 'NONE';
            debts[key] = r2(debts[key] + bal); debtCount[key]++;
            debtTotal = r2(debtTotal + bal);
        });
        const adminsByShift = { A:[], B:[], C:[], D:[] };
        const adminsNoShift = [];
        Object.entries(users || {}).forEach(([uid, u]) => {
            if (!u || u.role !== 'admin' || uid === refUid) return;
            if (SHIFTS.includes(u.shift)) adminsByShift[u.shift].push(u.name);
            else adminsNoShift.push(u.name);
        });
        const usersToConvert = Object.values(users || {}).filter(u => u && (u.role === 'user' || !u.role)).length;
        const refMember = memberEntries.find(([k, m]) => m.userId === refUid);
        return { debts, debtCount, debtTotal, adminsByShift, adminsNoShift, usersToConvert,
                 refMemberName: refMember ? refMember[1].name : null,
                 cassa: r2(old.cashRegister || 0),
                 nTx: Object.keys(old.transactions || {}).length,
                 nPurch: Object.keys(old.purchases || {}).length };
    },

    async run() {
        try {
            const snap = await db.ref('bar-data').once('value');
            const old = snap.val() || {};
            if (old.schemaVersion === 3) { console.log('[Migration] già v3'); return; }
            if (old.schemaVersion !== 2) { alert('Schema del database inatteso (' + old.schemaVersion + '): migrazione non eseguita.'); return; }
            const usersSnap = await db.ref('users').once('value');
            const allUsers = usersSnap.val() || {};
            const a = this.analyze(old, allUsers);

            // =========================================
            // ANTEPRIMA — numeri reali del momento
            // =========================================
            const adminLine = s => a.adminsByShift[s].length ? a.adminsByShift[s].join(', ') : '— nessuno (lo nomini tu dopo)';
            const message =
                '📋 ANTEPRIMA MIGRAZIONE — leggi prima di confermare\n\n' +
                '🏦 FONDO DISTACCAMENTO\n' +
                '   Cassa attuale che diventa fondo: €' + a.cassa.toFixed(2) + '\n' +
                '   Crediti pre-riforma da riscuotere: €' + a.debtTotal.toFixed(2) + '\n' +
                '   Patrimonio quando tutti avranno saldato: €' + r2(a.cassa + a.debtTotal).toFixed(2) + '\n\n' +
                '💳 DEBITI DI OGGI → si saldano al FONDO, non ai bar\n' +
                '   T A: €' + a.debts.A.toFixed(2) + ' (' + a.debtCount.A + ' vigili)\n' +
                '   T B: €' + a.debts.B.toFixed(2) + ' (' + a.debtCount.B + ' vigili)\n' +
                '   T C: €' + a.debts.C.toFixed(2) + ' (' + a.debtCount.C + ' vigili)\n' +
                '   T D: €' + a.debts.D.toFixed(2) + ' (' + a.debtCount.D + ' vigili)\n' +
                (a.debtCount.NONE ? '   Senza turno: €' + a.debts.NONE.toFixed(2) + ' (' + a.debtCount.NONE + ' vigili)\n' : '') +
                '   I 4 bar partono con cassa €0 e zero crediti.\n\n' +
                '👑 ADMIN (restano quelli di oggi)\n' +
                '   A: ' + adminLine('A') + '\n' +
                '   B: ' + adminLine('B') + '\n' +
                '   C: ' + adminLine('C') + '\n' +
                '   D: ' + adminLine('D') + '\n' +
                (a.adminsNoShift.length ? '   ⚠️ Admin senza turno: ' + a.adminsNoShift.join(', ') + '\n' : '') + '\n' +
                '📦 ARCHIVIO conservato: ' + a.nTx + ' transazioni, ' + a.nPurch + ' carichi/spese\n\n' +
                '👤 Tu diventi Referente (nessun turno)' + (a.refMemberName ? '; la tua scheda "' + a.refMemberName + '" esce dal turno' : '') + '\n\n' +
                'PROCEDERE con la migrazione?';

            if (!confirm(message)) { alert('Migrazione annullata. Nessun dato modificato.'); return; }
            if (!confirm('⚠️ ULTIMA CONFERMA\n\nLa migrazione modifica tutto il database (una copia completa resta in archivio).\n\nAvvisa prima i colleghi di chiudere l\'app vecchia.\n\nPROCEDERE DAVVERO?')) {
                alert('Migrazione annullata. Nessun dato modificato.'); return;
            }

            console.log('[Migration] inizio v2→v3');
            const now = new Date().toISOString();
            const startMonth = currentMonth() < QUOTA_START ? QUOTA_START : currentMonth();
            const refUid = Auth.user.uid;

            // 1) Archivio completo fuori da bar-data (così l'app non lo scarica ogni volta)
            await db.ref('bar-archive-v2').set({
                migratedAt: now, migratedBy: Auth.user.name,
                barData: old
            });

            // 2) Fondo distaccamento con la cassa attuale
            const fondoMovId = uid();
            const fondo = {
                saldo: a.cassa,
                quotaMensile: 25,
                startMonth,
                movimenti: {
                    [fondoMovId]: {
                        id: fondoMovId, tipo: 'avvio', importo: a.cassa,
                        descrizione: 'Patrimonio bar comune pre-riforma (' + new Date().toLocaleDateString('it-IT') + ')',
                        date: now, registeredBy: Auth.user.name, registeredByUid: refUid
                    }
                }
            };

            // 3) 4 bar vuoti
            const bars = {};
            SHIFTS.forEach(s => {
                bars[s] = { name: 'Bar Turno ' + s, subtitle: '', cassa: 0, allowGuests: true, allowCredit: true };
            });

            // 4) Vigili: debito di oggi → debitoFondo; i bar partono puliti
            const oldMemberMap = {};
            const newMembers = {};
            Object.entries(old.members || {}).forEach(([key, m]) => {
                if (!m) return;
                const id = m.id || key;
                oldMemberMap[id] = m;
                if ((m.name || '').trim().toLowerCase() === 'ospiti') return;
                const isRef = m.userId === refUid;
                newMembers[id] = {
                    id, name: m.name,
                    shift: isRef ? null : (SHIFTS.includes(m.shift) ? m.shift : null),
                    userId: m.userId || null,
                    balancePerBar: { A:0, B:0, C:0, D:0 },
                    debitoFondo: r2(m.balance > 0 ? m.balance : 0)
                };
            });

            // 5) Transazioni storiche: marcate come pre-riforma
            const newTx = {};
            Object.entries(old.transactions || {}).forEach(([key, t]) => {
                if (!t) return;
                const id = t.id || key;
                const mem = oldMemberMap[t.memberId] || {};
                newTx[id] = { ...t, id, shift: t.shift || mem.shift || null, quantity: t.quantity || 1,
                              isGuest: false, isExternal: !!t.isOspite, preRiforma: true };
            });

            // 6) Carichi/spese storici: marcati come pre-riforma (non appartengono a nessun bar)
            const newPurchases = {};
            Object.entries(old.purchases || {}).forEach(([key, p]) => {
                if (!p) return;
                const id = p.id || key;
                newPurchases[id] = { ...p, id, shift: null, preRiforma: true };
            });

            // 7) Scrittura unica e atomica di bar-data
            await db.ref('bar-data').update({
                schemaVersion: 3,
                lastUpdate: now,
                migrationV3Date: now,
                migrationV3By: Auth.user.name,
                fondoDistaccamento: fondo,
                bars,
                products: null,
                members: newMembers,
                transactions: newTx,
                purchases: newPurchases,
                cashRegister: null,
                archiveV2: null
            });

            // 8) Ruoli: io Referente, 'user' → 'vigile', gli admin di oggi restano admin
            const roleUpdates = {};
            roleUpdates[`users/${refUid}/role`] = 'referente';
            roleUpdates[`users/${refUid}/shift`] = null;
            Object.entries(allUsers).forEach(([uidK, u]) => {
                if (!u || uidK === refUid) return;
                if (u.role === 'user' || !u.role) roleUpdates[`users/${uidK}/role`] = 'vigile';
            });
            await db.ref().update(roleUpdates);
            Auth.user.role = 'referente';
            Auth.user.shift = null;

            console.log('[Migration] completata ✅');
            alert('✅ MIGRAZIONE COMPLETATA!\n\nLa cassa è ora il fondo distaccamento, i 4 bar sono pronti, tu sei Referente.\n\nControlla in 👑 Admin che ogni turno abbia almeno un admin.');
        } catch(e) {
            console.error('[Migration] ERRORE:', e);
            alert('⚠️ Errore migrazione: ' + e.message + '\n\nSe il problema persiste, i dati originali sono nel nodo "bar-archive-v2".');
        }
    }
};
</script>
