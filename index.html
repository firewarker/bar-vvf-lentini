        </details>
    `;
};
</script>
<script>
// =============================================
// PAGINE UTENTE (vigile + admin)
// =============================================

App.page_user_home = function() {
    const u = Auth.user;
    const sh = Auth.myShift();
    const me = this.myMember();
    const bar = sh ? this.bars[sh] : null;
    const bpb = me ? (me.balancePerBar || {}) : {};
    const myDebt = sh ? (bpb[sh] || 0) : 0;
    const myTx = me ? this.transactions.filter(t => t.memberId === me.id).sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,10) : [];
    const isAdmin = u.role === 'admin';
    const quotaStato = sh ? this.quotaStatus(sh) : null;

    // Banner amministrativo: quota mensile da versare (+ eventuale sollecito del Referente)
    let quotaBanner = '';
    if (isAdmin && bar && quotaStato !== 'pagata') {
        const unpaid = this.unpaidMonths(sh);
        const urg = quotaStato === 'ritardo';
        quotaBanner = `
            <div class="alert ${urg?'alert-danger':'alert-warn'}">
                <div class="flex-between">
                    <div><strong>⚠️ Quota da versare: ${unpaid.map(formatMonth).join(', ')}</strong><br><span class="text-sm">€${this.fondo.quotaMensile.toFixed(2)} al mese al fondo${urg?' · IN RITARDO':''}</span></div>
                    <button class="btn btn-${urg?'red':'warn'} btn-sm" onclick="App.modalVersaQuota()">Versa</button>
                </div>
                ${bar.sollecito ? `<div class="text-sm mt-1">🔔 Sollecito del Referente del ${fmt(bar.sollecito.date)}</div>` : ''}
            </div>
        `;
    }

    return `
        <h2>Ciao, ${escapeHtml(u.name)}!</h2>
        ${!sh ? '<div class="alert alert-warn">⚠️ Turno non assegnato — chiedi al Referente</div>' : ''}
        ${!bar ? '<div class="alert alert-warn">⚠️ Il bar del tuo turno non è ancora configurato</div>' : ''}
        ${quotaBanner}
        ${!me ? '<div class="alert alert-warn">⚠️ Il tuo account non è ancora collegato a un vigile dell\'elenco. Chiedi al Referente di collegarlo per vedere il tuo storico.</div>' : ''}

        ${me && sh ? `
            <div class="stats-row">
                <div class="stat-card">
                    <div class="label">💰 Mio debito nel Bar T${sh}</div>
                    <div class="value" style="color:${myDebt>0?'#dc2626':'#16a34a'}">€${myDebt.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <div class="label">🏪 Cassa T${sh}</div>
                    <div class="value color-green">€${bar ? bar.cassa.toFixed(2) : '0.00'}</div>
                </div>
            </div>

            ${myDebt > 0 ? `
                <button class="btn btn-green btn-full mb-2" onclick="App.modalPay()">
                    💵 Salda il mio debito (€${myDebt.toFixed(2)})
                </button>
            ` : '<div class="alert alert-ok">✅ Nessun debito nel tuo bar</div>'}

            ${me && (me.debitoFondo || 0) > 0 ? `
                <div class="alert alert-warn">
                    <div class="flex-between">
                        <div>
                            <strong>💰 Debito pre-riforma: €${me.debitoFondo.toFixed(2)}</strong><br>
                            <span class="text-sm">Debito accumulato prima della divisione dei turni. Va saldato al <strong>fondo distaccamento</strong>, non al bar.</span>
                        </div>
                        <button class="btn btn-warn btn-sm" onclick="App.modalPayFondo()">Salda</button>
                    </div>
                </div>
            ` : ''}
        ` : ''}

        ${bar && this._canGuestBuyElsewhere() ? `
            <button class="btn btn-light btn-full mb-2" onclick="App.modalBuyGuest()">
                🧳 Compra come ospite in altro turno
            </button>
        ` : ''}

        <h3>📋 Ultime transazioni</h3>
        ${myTx.length === 0 ? '<p class="text-sm text-gray text-center">Nessuna transazione</p>' :
            myTx.map(t => `
                <div class="item-row ${t.paid?'ok':'warn'}">
                    <div class="item-main">
                        <div class="item-title">${escapeHtml(t.productName)}${t.quantity>1?' <span class="chip chip-blue">×'+t.quantity+'</span>':''}${t.shift?' <span class="chip chip-shift">T'+t.shift+'</span>':''}</div>
                        <div class="item-sub">${fmt(t.date)}</div>
                    </div>
                    <div>
                        <strong>€${t.price.toFixed(2)}</strong>
                        <span class="chip ${t.paid?'chip-green':'chip-orange'}">${t.paid?'Pagato':'Credito'}</span>
                    </div>
                </div>
            `).join('')}
    `;
};

App._canGuestBuyElsewhere = function() {
    const sh = Auth.myShift();
    return SHIFTS.some(s => s !== sh && this.bars[s] && this.bars[s].allowGuests && (this.products[s]||[]).length > 0);
};

// ---- Acquista (vigile/admin del proprio turno) ----
App.page_acquista = function() {
    const sh = Auth.myShift();
    if (!sh) return '<div class="alert alert-warn">Turno non assegnato</div>';
    const bar = this.bars[sh];
    if (!bar) return '<div class="alert alert-warn">Bar non configurato</div>';
    const prodotti = this.products[sh] || [];
    const me = this.myMember();

    if (prodotti.length === 0) {
        return `
            <h2>🛒 ${escapeHtml(bar.name)}</h2>
            <div class="alert alert-info">Nessun prodotto disponibile. Un admin del turno deve aggiungere prodotti dal magazzino.</div>
        `;
    }

    return `
        <h2>🛒 ${escapeHtml(bar.name)}</h2>
        ${!me ? '<div class="alert alert-warn">⚠️ Il tuo account non è collegato a un vigile. Chiedi al Referente.</div>' : ''}
        <div class="product-grid">
            ${prodotti.map(p => this._renderProductCard(p, sh, false)).join('')}
        </div>

        ${me ? `
            <div class="divider"></div>
            <button class="btn btn-light btn-full" onclick="App.modalExternal()">
                👤 Vendita a persona esterna (da altra sede)
            </button>
        ` : ''}
    `;
};

App._renderProductCard = function(p, shift, isAdminSale) {
    const stock = p.stock || 0;
    const outOfStock = stock <= 0;
    const canCredit = this.bars[shift] && this.bars[shift].allowCredit;
    return `
        <div class="p-card ${p.isCoffee?'coffee':''}" style="${outOfStock?'opacity:0.5':''}">
            <div class="name">${escapeHtml(p.name)}${p.isCoffee?'<span class="coffee-tag">CAFFÈ</span>':''}</div>
            <div class="price">€${p.price.toFixed(2)}</div>
            <div class="stock ${outOfStock?'stock-out':stock<=5?'stock-low':'stock-ok'}">Stock: ${stock}</div>
            ${outOfStock ? '<div class="text-center text-sm color-red font-bold">ESAURITO</div>' : `
                <div class="flex">
                    ${canCredit ? `<button class="btn btn-orange btn-sm" style="flex:1" onclick="App.modalBuy('${p.id}','${shift}',false,${isAdminSale})">📝 Credito</button>` : ''}
                    <button class="btn btn-green btn-sm" style="flex:1" onclick="App.modalBuy('${p.id}','${shift}',true,${isAdminSale})">💵 Paga</button>
                </div>
            `}
        </div>
    `;
};

// ---- Storico (vigile) ----
App.page_user_storico = function() {
    const me = this.myMember();
    if (!me) return '<div class="alert alert-warn">Account non collegato</div>';
    const myTx = this.transactions.filter(t => t.memberId === me.id).sort((a,b) => new Date(b.date)-new Date(a.date));
    const bpb = me.balancePerBar || {};
    return `
        <h2>📋 Il mio storico</h2>
        <div class="stats-row">
            ${SHIFTS.map(s => `
                <div class="stat-card">
                    <div class="label">T${s}</div>
                    <div class="value" style="color:${(bpb[s]||0)>0?'#dc2626':'#16a34a'}">€${(bpb[s]||0).toFixed(2)}</div>
                </div>
            `).join('')}
        </div>

        ${(me.debitoFondo||0) > 0 ? `<div class="alert alert-warn">💰 Debito pre-riforma (da saldare al fondo): <strong>€${me.debitoFondo.toFixed(2)}</strong> <button class="btn btn-warn btn-sm" onclick="App.modalPayFondo()">Salda</button></div>` : ''}
        <h3>Tutte le transazioni (${myTx.length})</h3>
        ${myTx.length === 0 ? '<p class="text-center text-gray">Nessuna transazione</p>' :
            myTx.slice(0,100).map(t => `
                <div class="item-row ${t.paid?'ok':'warn'}">
                    <div class="item-main">
                        <div class="item-title">${escapeHtml(t.productName)}${t.quantity>1?' <span class="chip chip-blue">×'+t.quantity+'</span>':''}${t.shift?' <span class="chip chip-shift">T'+t.shift+'</span>':''}</div>
                        <div class="item-sub">${fmt(t.date)}</div>
                    </div>
                    <div>
                        <strong>€${t.price.toFixed(2)}</strong>
                        <span class="chip ${t.paid?'chip-green':'chip-orange'}">${t.paid?'Pagato':'Credito'}</span>
                    </div>
                </div>
            `).join('')}
    `;
};
</script>
<script>
// =============================================
// PAGINE ADMIN DI TURNO
// =============================================

App.page_admin_vendita = function() {
    const sh = Auth.myShift();
    if (!sh) return '<div class="alert alert-warn">Turno non assegnato</div>';
    const bar = this.bars[sh];
    if (!bar) return '<div class="alert alert-warn">Bar non configurato</div>';
    const vigiliTurno = this.active().filter(m => m.shift === sh);
    const sel = this.active().find(m => m.id === this._saleSelected);
    const prodotti = this.products[sh] || [];

    return `
        <h2>💵 Vendita ${escapeHtml(bar.name)}</h2>

        <div class="form-group">
            <label>Seleziona vigile</label>
            <select onchange="App._saleSelected=this.value;App.render()">
                <option value="">— Scegli —</option>
                ${vigiliTurno.sort((a,b)=>a.name.localeCompare(b.name)).map(m => {
                    const dbt = (m.balancePerBar||{})[sh]||0;
                    return `<option value="${m.id}" ${this._saleSelected===m.id?'selected':''}>${escapeHtml(m.name)}${dbt>0?' (€'+dbt.toFixed(2)+')':''}</option>`;
                }).join('')}
            </select>
        </div>

        ${!sel ? '<p class="text-center text-gray" style="padding:2rem">Seleziona un vigile per vendere</p>' : `
            <div class="alert alert-info">
                <strong>${escapeHtml(sel.name)}</strong><br>
                Debito nel tuo bar: <strong class="color-orange">€${((sel.balancePerBar||{})[sh]||0).toFixed(2)}</strong>
            </div>

            ${prodotti.length === 0 ? '<div class="alert alert-info">Nessun prodotto in magazzino</div>' : `
                <div class="product-grid">
                    ${prodotti.map(p => this._renderProductCardForAdmin(p, sh, sel.id)).join('')}
                </div>
            `}
        `}

        <div class="divider"></div>
        <button class="btn btn-light btn-full" onclick="App.modalExternal()">
            👤 Vendita a persona esterna
        </button>
    `;
};

App._saleSelected = '';

App._renderProductCardForAdmin = function(p, shift, memberId) {
    const stock = p.stock || 0;
    const outOfStock = stock <= 0;
    const canCredit = this.bars[shift] && this.bars[shift].allowCredit;
    return `
        <div class="p-card ${p.isCoffee?'coffee':''}" style="${outOfStock?'opacity:0.5':''}">
            <div class="name">${escapeHtml(p.name)}${p.isCoffee?'<span class="coffee-tag">CAFFÈ</span>':''}</div>
            <div class="price">€${p.price.toFixed(2)}</div>
            <div class="stock ${outOfStock?'stock-out':stock<=5?'stock-low':'stock-ok'}">Stock: ${stock}</div>
            ${outOfStock ? '<div class="text-center text-sm color-red font-bold">ESAURITO</div>' : `
                <div class="flex">
                    ${canCredit ? `<button class="btn btn-orange btn-sm" style="flex:1" onclick="App.modalAdminSell('${p.id}','${shift}','${memberId}',false)">Credito</button>` : ''}
                    <button class="btn btn-green btn-sm" style="flex:1" onclick="App.modalAdminSell('${p.id}','${shift}','${memberId}',true)">Paga</button>
                </div>
            `}
        </div>
    `;
};

// ---- Magazzino admin ----
App.page_admin_magazzino = function() {
    const sh = Auth.myShift();
    if (!sh) return '<div class="alert alert-warn">Turno non assegnato</div>';
    const bar = this.bars[sh];
    const prodotti = this.products[sh] || [];

    return `
        <div class="flex-between mb-2">
            <h2 style="margin:0">📦 Magazzino T${sh}</h2>
            <button class="btn btn-red btn-sm" onclick="App.modalNewProduct()">+ Nuovo</button>
        </div>
        <div class="alert alert-info">I prodotti qui elencati sono del tuo turno. Gli altri turni hanno i propri.</div>

        ${prodotti.length === 0 ? '<div class="alert alert-info">Nessun prodotto. Aggiungine uno col pulsante "Nuovo".</div>' :
            prodotti.map(p => `
                <div class="item-row ${p.isCoffee?'highlight':''}">
                    <div class="item-main">
                        <div class="item-title">${escapeHtml(p.name)} ${p.isCoffee?'<span class="coffee-tag">CAFFÈ</span>':''}</div>
                        <div class="item-sub">€${p.price.toFixed(2)} · stock: ${p.stock || 0}</div>
                    </div>
                    <div class="item-actions">
                        <button class="btn btn-blue btn-sm" onclick="App.modalCarico('${p.id}')" title="Carica"><i>📥</i></button>
                        <button class="btn btn-light btn-sm" onclick="App.modalEditProduct('${p.id}')" title="Modifica">✏️</button>
                        <button class="btn btn-sm" style="background:#fee2e2;color:#991b1b" onclick="App.deleteProduct('${p.id}')" title="Elimina">🗑️</button>
                    </div>
                </div>
            `).join('')}
    `;
};

// ---- Conti vigili del turno ----
App.page_admin_conti = function() {
    const sh = Auth.myShift();
    if (!sh) return '<div class="alert alert-warn">Turno non assegnato</div>';
    const vigiliTurno = this.active().filter(m => m.shift === sh).sort((a,b) => a.name.localeCompare(b.name));

    // Include anche eventuali debiti del Referente in questo bar
    const refDebiti = this.members.filter(m => (m.balancePerBar||{})[sh] > 0 && (m.shift !== sh || m.removed));

    const totale = vigiliTurno.reduce((s,m) => s + ((m.balancePerBar||{})[sh] || 0), 0)
                 + refDebiti.reduce((s,m) => s + ((m.balancePerBar||{})[sh] || 0), 0);

    return `
        <h2>📋 Conti vigili Turno ${sh}</h2>
        <div class="alert alert-info">Totale crediti del tuo bar: <strong>€${totale.toFixed(2)}</strong></div>

        <h3>Vigili del tuo turno (${vigiliTurno.length})</h3>
        ${vigiliTurno.map(m => {
            const dbt = (m.balancePerBar||{})[sh] || 0;
            const dbtFondo = m.debitoFondo || 0;
            return `
                <div class="item-row ${(dbt>0||dbtFondo>0)?'warn':'ok'}">
                    <div class="item-main">
                        <div class="item-title">${escapeHtml(m.name)}</div>
                        <div class="item-sub">
                            ${dbt>0 ? `Bar: <strong class="color-red">€${dbt.toFixed(2)}</strong>` : 'Bar: €0'}
                            ${dbtFondo>0 ? ` · Pre-riforma: <strong class="color-orange">€${dbtFondo.toFixed(2)}</strong>` : ''}
                        </div>
                    </div>
                    <div class="item-actions">
                        ${dbt > 0 ? `<button class="btn btn-green btn-sm" onclick="App.modalPayFromAdmin('${m.id}')" title="Salda al bar">🏪 €${dbt.toFixed(2)}</button>` : ''}
                        ${dbtFondo > 0 ? `<button class="btn btn-warn btn-sm" onclick="App.modalPayFondo('${m.id}')" title="Salda al fondo">💰 €${dbtFondo.toFixed(2)}</button>` : ''}
                    </div>
                </div>
            `;
        }).join('')}

        ${refDebiti.length > 0 ? `
            <div class="divider"></div>
            <h3>Ospiti con debito (${refDebiti.length})</h3>
            <div class="text-sm text-gray mb-1">Referente / vigili di altri turni che hanno a debito nel tuo bar</div>
            ${refDebiti.map(m => {
                const dbt = (m.balancePerBar||{})[sh] || 0;
                return `
                    <div class="item-row warn">
                        <div class="item-main">
                            <div class="item-title">${escapeHtml(m.name)} <span class="chip chip-gray">${m.removed ? 'trasferito' : (m.shift ? 'T'+m.shift : 'Referente')}</span></div>
                        </div>
                        <strong class="color-orange">€${dbt.toFixed(2)}</strong>
                    </div>
                `;
            }).join('')}
        ` : ''}
        ${this._renderUnlinkedForShift(sh)}
    `;
};

// ---- Cassa del bar (admin): movimenti + vendite ----
App.page_admin_cassa = function() {
    const sh = Auth.myShift();
    if (!sh) return '<div class="alert alert-warn">Turno non assegnato</div>';
    const bar = this.bars[sh];
    return `
        <h2>💶 Cassa ${escapeHtml(bar.name)}</h2>
        <div class="stats-row">
            <div class="stat-card"><div class="label">💰 In cassa</div><div class="value" style="color:${bar.cassa<0?'#dc2626':'#16a34a'}">€${bar.cassa.toFixed(2)}</div></div>
            <div class="stat-card"><div class="label">📊 Crediti</div><div class="value color-orange">€${this.crediti(sh).toFixed(2)}</div></div>
        </div>
        <button class="btn btn-red btn-full mb-2" onclick="App.modalBarMovimento()">📝 Movimento cassa (spesa / entrata)</button>
        ${this._renderBarHistory(sh)}
    `;
};

// Storico movimenti e vendite di un bar (usato da admin e da ispezione Referente)
App._renderBarHistory = function(sh) {
    const movs = this.purchases.filter(p => p.shift === sh && !p.preRiforma).sort((a,b) => new Date(b.date)-new Date(a.date));
    const sales = this.transactions.filter(t => t.shift === sh && !t.preRiforma).sort((a,b) => new Date(b.date)-new Date(a.date));
    return `
        <details class="collapsible-section">
            <summary>🧾 Movimenti cassa (${movs.length})</summary>
            <div class="collapsible-body">
                ${movs.length === 0 ? '<p class="text-center text-sm text-gray">Nessun movimento</p>' : movs.slice(0,50).map(p => {
                    const d = p.cashDelta !== undefined ? p.cashDelta : -(p.amount || 0);
                    return `<div class="item-row ${d>=0?'ok':'warn'}">
                        <div class="item-main"><div class="item-title">${escapeHtml(p.description)}</div><div class="item-sub">${fmt(p.date)} · ${escapeHtml(p.registeredBy||'')}</div></div>
                        <strong class="${d>=0?'color-green':'color-red'}">${d===0?'—':(d>0?'+':'-')+'€'+Math.abs(d).toFixed(2)}</strong>
                    </div>`;
                }).join('')}
            </div>
        </details>
        <details class="collapsible-section">
            <summary>📊 Vendite (${sales.length})</summary>
            <div class="collapsible-body">
                ${sales.length === 0 ? '<p class="text-center text-sm text-gray">Nessuna vendita</p>' : sales.slice(0,50).map(t => `
                    <div class="item-row ${t.paid?'ok':'warn'}">
                        <div class="item-main">
                            <div class="item-title">${escapeHtml(t.isExternal ? (t.externalName||'Esterno') : t.memberName)} → ${escapeHtml(t.productName)}${t.quantity>1?' <span class="chip chip-blue">×'+t.quantity+'</span>':''}${t.isGuest?' <span class="chip chip-gray">ospite</span>':''}</div>
                            <div class="item-sub">${fmt(t.date)}${t.isExternal && t.offeredByMemberName ? ' · offerto da '+escapeHtml(t.offeredByMemberName) : ''}</div>
                        </div>
                        <div><strong>€${t.price.toFixed(2)}</strong> <span class="chip ${t.paid?'chip-green':'chip-orange'}">${t.paid?'Pagato':'Credito'}</span></div>
                    </div>`).join('')}
            </div>
        </details>
    `;
};

App.modalBarMovimento = function() {
    const sh = Auth.myShift();
    modal('📝 Movimento cassa', `
        <div class="alert alert-info text-sm">Per spese non legate a un prodotto (es. tovaglioli) o entrate (es. rimborso, versamento iniziale). Per la merce usa 📥 Carico nel Magazzino.</div>
        <div class="form-group">
            <label>Tipo</label>
            <div class="flex">
                <button type="button" id="bm-spesa" class="btn btn-red" style="flex:1" onclick="App._pickBarMov('spesa')">🔴 Spesa</button>
                <button type="button" id="bm-entrata" class="btn btn-light" style="flex:1" onclick="App._pickBarMov('entrata')">🟢 Entrata</button>
            </div>
            <input type="hidden" id="bm-type" value="spesa">
        </div>
        <div class="form-group"><label>Descrizione</label><input type="text" id="bm-desc" placeholder="Es: tovaglioli, rimborso..."></div>
        <div class="form-group"><label>Importo (€)</label><input type="number" id="bm-amt" step="0.10" min="0.10"></div>
        <button class="btn btn-red btn-full" onclick="App.doBarMovimento('${sh}')">Registra</button>
    `);
};
App._pickBarMov = function(t) {
    document.getElementById('bm-type').value = t;
    document.getElementById('bm-spesa').className = t === 'spesa' ? 'btn btn-red' : 'btn btn-light';
    document.getElementById('bm-entrata').className = t === 'entrata' ? 'btn btn-green' : 'btn btn-light';
};
App.doBarMovimento = async function(sh) {
    const type = document.getElementById('bm-type').value;
    const desc = document.getElementById('bm-desc').value.trim();
    const amt = r2(parseFloat(document.getElementById('bm-amt').value) || 0);
    if (!desc || amt <= 0) { alert('Inserisci descrizione e importo'); return; }
    const delta = type === 'entrata' ? amt : -amt;
    if (!confirm(`${type === 'entrata' ? 'Entrata' : 'Spesa'} di €${amt.toFixed(2)} nella cassa del Bar T${sh}?`)) return;
    try {
        await db.ref(`bar-data/bars/${sh}/cassa`).transaction(c => r2((c||0) + delta));
        const pId = uid();
        await db.ref(`bar-data/purchases/${pId}`).set({
            id: pId, shift: sh,
            description: (type === 'entrata' ? '🟢 Entrata: ' : '🔴 Spesa: ') + desc,
            amount: type === 'entrata' ? 0 : amt, qty: 0, cashDelta: delta,
            productId: null, productName: null, isCoffee: false, isAdjustment: type === 'entrata',
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert('✅ Movimento registrato');
    } catch(e) { alert('Errore: ' + e.message); }
};

// ---- Account del turno non ancora collegati (admin) ----
App._renderUnlinkedForShift = function(sh) {
    const accounts = this.users.filter(u => u.shift === sh && u.role !== 'referente' && u.role !== 'super_admin' && !this.members.some(m => m.userId === u.uid));
    if (accounts.length === 0) return '';
    return `
        <div class="divider"></div>
        <h3>🆕 Account del turno da collegare (${accounts.length})</h3>
        <div class="text-sm text-gray mb-1">Si sono registrati ma non hanno ancora una scheda: finché non li colleghi non possono comprare.</div>
        ${accounts.map(u => `
            <div class="item-row">
                <div class="item-main"><div class="item-title">${escapeHtml(u.name)}</div><div class="item-sub">${escapeHtml(u.email)}</div></div>
                <div class="item-actions">
                    <button class="btn btn-blue btn-sm" onclick="App.modalLinkUser('${u.uid}')">Collega</button>
                    <button class="btn btn-green btn-sm" onclick="App.createMemberFromUser('${u.uid}')">Nuovo vigile</button>
                </div>
            </div>`).join('')}
    `;
};

// Crea una scheda vigile nuova per un account registrato (per chi non era nell'elenco)
App.createMemberFromUser = async function(userUid) {
    const u = this.users.find(x => x.uid === userUid);
    if (!u) return;
    if (this.members.some(m => m.userId === userUid)) { alert('Account già collegato'); return; }
    const sameName = this.members.find(m => !m.userId && m.name.trim().toLowerCase() === (u.name||'').trim().toLowerCase());
    if (sameName && !confirm(`Esiste già "${sameName.name}" non collegato. Se è la stessa persona usa "Collega" per non perdere lo storico.\n\nCreare comunque una scheda NUOVA?`)) return;
    if (!sameName && !confirm(`Creare la scheda nuova per "${u.name}" (Turno ${u.shift || '—'})?\nUsala solo per chi NON era già nell'elenco.`)) return;
    try {
        const id = uid();
        await db.ref(`bar-data/members/${id}`).set({
            id, name: u.name, shift: SHIFTS.includes(u.shift) ? u.shift : null, userId: userUid,
            balancePerBar: { A:0, B:0, C:0, D:0 }, debitoFondo: 0
        });
        alert(`✅ Scheda creata e collegata a ${u.name}`);
    } catch(e) { alert('Errore: ' + e.message); }
};

// Cambio turno (Referente): il debito nel vecchio bar resta lì finché non viene saldato
App.modalChangeShift = function(memberId) {
    const m = this.members.find(x => x.id === memberId);
    if (!m) return;
    modal(`🔄 Cambia turno: ${escapeHtml(m.name)}`, `
        <div class="alert alert-info text-sm">Turno attuale: <strong>${m.shift || '—'}</strong>. Eventuali debiti nel vecchio bar restano lì finché non vengono saldati. Se era admin, torna vigile.</div>
        <div class="shift-pick">
            ${SHIFTS.map(s => `<button class="shift-opt ${m.shift===s?'selected':''}" onclick="App.doChangeShift('${memberId}','${s}')">${s}</button>`).join('')}
        </div>
    `);
};
App.doChangeShift = async function(memberId, newShift) {
    const m = this.members.find(x => x.id === memberId);
    if (!m || m.shift === newShift) { modalClose(); return; }
    if (!confirm(`Spostare ${m.name} dal turno ${m.shift || '—'} al turno ${newShift}?`)) return;
    try {
        const updates = {};
        updates[`bar-data/members/${memberId}/shift`] = newShift;
        if (m.userId) {
            const u = this.users.find(x => x.uid === m.userId);
            updates[`users/${m.userId}/shift`] = newShift;
            if (u && u.role === 'admin') updates[`users/${m.userId}/role`] = 'vigile';
        }
        await db.ref().update(updates);
        modalClose();
        alert(`✅ ${m.name} ora è nel turno ${newShift}`);
    } catch(e) { alert('Errore: ' + e.message); }
};

<script>

// ============ ACQUISTO (vigile normale o ospite) ============
App.modalBuy = function(prodId, shift, payNow, isAdminSale) {
    const me = this.myMember();
    if (!me && !Auth.isReferente()) { alert('Account non collegato. Chiedi al Referente.'); return; }
    const prod = (this.products[shift] || []).find(p => p.id === prodId);
    if (!prod) return;
    const maxAvail = prod.stock || 0;
    if (maxAvail <= 0) { alert('Esaurito!'); return; }

    const bar = this.bars[shift];
    const payLabel = payNow ? '💵 Pagamento immediato' : '📝 A credito';
    const payColor = payNow ? '#16a34a' : '#ea580c';

    modal(`🛒 ${escapeHtml(prod.name)}`, `
        <div class="alert alert-info">
            <strong>${escapeHtml(bar.name)}</strong> — <strong>${escapeHtml(prod.name)}</strong><br>
            Prezzo: <strong>€${prod.price.toFixed(2)}</strong> · Disponibili: <strong>${maxAvail}</strong>
        </div>
        <div class="alert" style="background:${payNow?'#d1fae5':'#fef3c7'};color:${payColor};border-left-color:${payColor}">
            <strong>${payLabel}</strong>
        </div>
        <div class="form-group">
            <label>Quantità</label>
            <div class="flex" style="align-items:center">
                <button type="button" class="btn btn-light btn-icon" onclick="App._qtyChange(-1,${maxAvail})">−</button>
                <input type="number" id="buy-qty" min="1" max="${maxAvail}" value="1" oninput="App._qtyUpdate(${maxAvail},${prod.price})" style="flex:1;text-align:center;font-size:1.3rem;font-weight:700">
                <button type="button" class="btn btn-light btn-icon" onclick="App._qtyChange(1,${maxAvail})">+</button>
            </div>
        </div>
        <div class="alert alert-info text-sm" id="buy-preview">Totale: <strong>€${prod.price.toFixed(2)}</strong></div>
        <button class="btn ${payNow?'btn-green':'btn-orange'} btn-full" onclick="App.doBuy('${prod.id}','${shift}',${payNow},${isAdminSale})">
            ${payNow?'💵 Conferma pagamento':'📝 Conferma credito'}
        </button>
    `);
};

App._qtyChange = function(delta, max) {
    const el = document.getElementById('buy-qty');
    let v = parseInt(el.value) || 1;
    v = Math.max(1, Math.min(max, v + delta));
    el.value = v;
    this._qtyUpdate(max);
};
App._qtyUpdate = function(max, price) {
    const el = document.getElementById('buy-qty');
    if (!el) return;
    let v = parseInt(el.value) || 1;
    if (v < 1) { v = 1; el.value = 1; }
    if (v > max) { v = max; el.value = max; }
    const preview = document.getElementById('buy-preview');
    if (preview && price !== undefined) {
        preview.innerHTML = `${v} × €${price.toFixed(2)} = <strong>€${(v*price).toFixed(2)}</strong>`;
    }
};

App.doBuy = async function(prodId, shift, payNow, isAdminSale) {
    const me = this.myMember();
    if (!me) { alert('Account non collegato.'); return; }
    const prod = (this.products[shift] || []).find(p => p.id === prodId);
    if (!prod) return;
    if (!payNow && !(this.bars[shift] || {}).allowCredit) { alert('Questo bar non accetta acquisti a credito.'); return; }
    const qty = parseInt(document.getElementById('buy-qty').value) || 1;
    if (qty < 1) return;
    const totalPrice = r2(qty * prod.price);

    try {
        if (!(await takeStock(shift, prod.id, qty))) { alert('⚠️ Scorte insufficienti: qualcuno ha appena preso questo prodotto. Riprova.'); return; }
        if (payNow) {
            await db.ref(`bar-data/bars/${shift}/cassa`).transaction(c => r2((c||0) + totalPrice));
        } else {
            await db.ref(`bar-data/members/${me.id}/balancePerBar/${shift}`).transaction(c => r2((c||0) + totalPrice));
        }
        const txId = uid();
        await db.ref(`bar-data/transactions/${txId}`).set({
            id: txId, shift,
            memberId: me.id, memberName: me.name,
            productId: prod.id, productName: prod.name,
            price: totalPrice, unitPrice: prod.price, quantity: qty,
            paid: payNow, isCoffee: !!prod.isCoffee,
            isGuest: false, isExternal: false,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ ${qty} × ${prod.name} — €${totalPrice.toFixed(2)}\n${payNow?'(pagato in cassa)':'(a credito)'}`);
    } catch(e) {
        console.error(e);
        alert('Errore: ' + e.message);
    }
};

// ============ VENDITA ADMIN (per vigile scelto) ============
App.modalAdminSell = function(prodId, shift, memberId, payNow) {

        <div class="alert alert-info">
            Vigile: <strong>${escapeHtml(member.name)}</strong><br>
            Prodotto: <strong>${escapeHtml(prod.name)}</strong><br>
            Prezzo unitario: <strong>€${prod.price.toFixed(2)}</strong> · Disponibili: <strong>${maxAvail}</strong>
        </div>
        <div class="alert" style="background:${payNow?'#d1fae5':'#fef3c7'};color:${payColor};border-left-color:${payColor}"><strong>${payLabel}</strong></div>
        <div class="form-group">
            <label>Quantità</label>
            <div class="flex" style="align-items:center">
                <button type="button" class="btn btn-light btn-icon" onclick="App._qtyChange(-1,${maxAvail})">−</button>
                <input type="number" id="buy-qty" min="1" max="${maxAvail}" value="1" oninput="App._qtyUpdate(${maxAvail},${prod.price})" style="flex:1;text-align:center;font-size:1.3rem;font-weight:700">
                <button type="button" class="btn btn-light btn-icon" onclick="App._qtyChange(1,${maxAvail})">+</button>
            </div>
        </div>
        <div class="alert alert-info text-sm" id="buy-preview">Totale: <strong>€${prod.price.toFixed(2)}</strong></div>
        <button class="btn ${payNow?'btn-green':'btn-orange'} btn-full" onclick="App.doAdminSell('${prod.id}','${shift}','${memberId}',${payNow})">Conferma</button>
    `);
};

App.doAdminSell = async function(prodId, shift, memberId, payNow) {
    const prod = (this.products[shift] || []).find(p => p.id === prodId);
    const member = this.members.find(m => m.id === memberId);

    try {
        if (!(await takeStock(shift, prod.id, qty))) { alert('⚠️ Scorte insufficienti: qualcuno ha appena preso questo prodotto. Riprova.'); return; }
        if (payNow) {
            await db.ref(`bar-data/bars/${shift}/cassa`).transaction(c => r2((c||0) + totalPrice));
        } else {
            await db.ref(`bar-data/members/${member.id}/balancePerBar/${shift}`).transaction(c => r2((c||0) + totalPrice));
        }
        const txId = uid();
        await db.ref(`bar-data/transactions/${txId}`).set({
            id: txId, shift,
            memberId: member.id, memberName: member.name,
            productId: prod.id, productName: prod.name,
            price: totalPrice, unitPrice: prod.price, quantity: qty,
            paid: payNow, isCoffee: !!prod.isCoffee,
            isGuest: false, isExternal: false,
            date: new Date().toISOString(),
            registeredBy: Auth.user.name, registeredByUid: Auth.user.uid
        });
        await db.ref('bar-data/lastUpdate').set(new Date().toISOString());
        modalClose();
        alert(`✅ ${qty} × ${prod.name} → ${member.name}\n€${totalPrice.toFixed(2)}`);
